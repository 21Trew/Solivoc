name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "admin.html"
      - "sw.js"
      - "*.webmanifest"
      - "data/**"
      - "icons/**"
      - "js/**"
      - "styles/**"
      - "scripts/build-frontend.mjs"
      - "package.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-frontend/admin.html
          test -f dist-frontend/js/admin.js
          grep -q 'adminBackup' dist-frontend/js/admin.js
          grep -q 'backup-20260821-2' dist-frontend/admin.html

      - name: Upload to Yandex Object Storage
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ vars.YC_BUCKET }}
          root: ./dist-frontend
          include: '**/*'
          clear: false
          skip-unchanged: true
          fail-on-error: true
          cache-control: |
            *.html: no-cache
            sw.js: no-cache
            js/runtime-config.js: no-cache
            **/*.js, **/*.css: no-cache
            **/*.json, **/*.webmanifest: no-cache
            *: public, max-age=3600

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail

          admin_html="$(curl --fail --silent --show-error             --retry 10 --retry-delay 3 --retry-all-errors             -H 'Cache-Control: no-cache'             "https://solivoc.ru/admin.html?ci=${GITHUB_SHA}")"
          printf '%s' "$admin_html" | grep -q 'backup-20260821-2'

          admin_js="$(curl --fail --silent --show-error             --retry 10 --retry-delay 3 --retry-all-errors             -H 'Cache-Control: no-cache'             "https://solivoc.ru/js/admin.js?v=backup-20260821-2&ci=${GITHUB_SHA}")"
          printf '%s' "$admin_js" | grep -q 'adminBackup'

          echo "Production admin bundle is current."
