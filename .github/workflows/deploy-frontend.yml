name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.xml"
      - "*.txt"
      - "sw.js"
      - "*.webmanifest"
      - "data/**"
      - "icons/**"
      - "js/**"
      - "styles/**"
      - "scripts/build-frontend.mjs"
      - "package.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA:0:12}"

          test -f dist-frontend/admin.html
          test -f dist-frontend/about.html
          test -f dist-frontend/robots.txt
          test -f dist-frontend/sitemap.xml
          test -f dist-frontend/js/admin.js
          test -f dist-frontend/js/runtime-config.js
          test -f dist-frontend/sw.js

          grep -q 'SECTION_META' dist-frontend/js/admin.js
          grep -q 'data-section="players"' dist-frontend/admin.html
          grep -q 'adminConfirmDialog' dist-frontend/admin.html
          grep -q 'rel="canonical" href="https://solivoc.ru/"' dist-frontend/index.html
          grep -q 'application/ld+json' dist-frontend/index.html
          grep -q 'Sitemap: https://solivoc.ru/sitemap.xml' dist-frontend/robots.txt
          grep -q '<loc>https://solivoc.ru/about.html</loc>' dist-frontend/sitemap.xml
          grep -q "js/admin.js?v=${BUILD_ID}" dist-frontend/admin.html
          grep -q 'solivoc-pwa-update-requested-v2' dist-frontend/js/runtime-config.js
          grep -q "worditaire-build-${BUILD_ID}" dist-frontend/sw.js

          test ! -e dist-frontend/admin-backup.html
          test ! -e dist-frontend/js/admin-backup.js
          test ! -e dist-frontend/js/admin-20260821.js

      - name: Upload frontend assets
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ vars.YC_BUCKET }}
          root: ./dist-frontend
          include: '**/*'
          exclude: 'sw.js'
          clear: false
          skip-unchanged: true
          fail-on-error: true
          cache-control: |
            *.html: no-cache
            js/runtime-config.js: no-cache
            **/*.js, **/*.css: no-cache
            **/*.json, **/*.webmanifest: no-cache
            *.xml, *.txt: no-cache
            *: public, max-age=3600

      # Publish the service worker only after every asset it will cache is
      # already present in Object Storage. This prevents mixed generations.
      - name: Publish service worker last
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ vars.YC_BUCKET }}
          root: ./dist-frontend
          include: 'sw.js'
          clear: false
          skip-unchanged: false
          fail-on-error: true
          cache-control: |
            sw.js: no-cache
            *: no-cache

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA:0:12}"

          fetch() {
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' "$1"
          }
          require_contains() {
            local content="$1"
            local expected="$2"
            local label="$3"
            if [[ "$content" != *"$expected"* ]]; then
              echo "Smoke test failed: ${label} is missing expected marker: ${expected}" >&2
              exit 1
            fi
          }

          admin_html="$(fetch "https://solivoc.ru/admin.html?ci=${GITHUB_SHA}")"
          require_contains "$admin_html" "js/admin.js?v=${BUILD_ID}" "admin.html build id"
          require_contains "$admin_html" 'data-section="players"' "admin.html navigation"
          require_contains "$admin_html" 'adminConfirmDialog' "admin.html confirm dialog"

          admin_js="$(fetch "https://solivoc.ru/js/admin.js?ci=${GITHUB_SHA}")"
          require_contains "$admin_js" 'SECTION_META' "admin.js"

          runtime_config="$(fetch "https://solivoc.ru/js/runtime-config.js?ci=${GITHUB_SHA}")"
          require_contains "$runtime_config" 'solivoc-pwa-update-requested-v2' "runtime-config.js"

          service_worker="$(fetch "https://solivoc.ru/sw.js?ci=${GITHUB_SHA}")"
          require_contains "$service_worker" "worditaire-build-${BUILD_ID}" "service worker build id"

          root_html="$(fetch "https://solivoc.ru/?ci=${GITHUB_SHA}")"
          require_contains "$root_html" 'rel="canonical" href="https://solivoc.ru/"' "index canonical"
          require_contains "$root_html" 'application/ld+json' "index structured data"

          robots="$(fetch "https://solivoc.ru/robots.txt?ci=${GITHUB_SHA}")"
          require_contains "$robots" 'Sitemap: https://solivoc.ru/sitemap.xml' "robots.txt"

          sitemap="$(fetch "https://solivoc.ru/sitemap.xml?ci=${GITHUB_SHA}")"
          require_contains "$sitemap" '<loc>https://solivoc.ru/about.html</loc>' "sitemap.xml"

          about="$(fetch "https://solivoc.ru/about.html?ci=${GITHUB_SHA}")"
          require_contains "$about" 'Словасьянс — игра в ассоциации' "about.html"

          echo "Production frontend, PWA and SEO files are current."
