name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "admin.html"
      - "sw.js"
      - "*.webmanifest"
      - "data/**"
      - "icons/**"
      - "js/**"
      - "styles/**"
      - "scripts/build-frontend.mjs"
      - "package.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build frontend
        run: npm run build:frontend

      - name: Upload to Yandex Object Storage
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ vars.YC_BUCKET }}
          root: ./dist-frontend
          clear: false
          skip-unchanged: true
          fail-on-error: true
          cache-control: |
            *.html: no-cache
            sw.js: no-cache
            js/runtime-config.js: no-cache
            *.js, *.css: no-cache
            *.json, *.webmanifest: no-cache
            *: public, max-age=3600

      - name: Smoke test production
        run: |
          curl --fail --silent --show-error             --retry 5 --retry-delay 3             https://solivoc.ru/ > /dev/null
          curl --fail --silent --show-error             --retry 5 --retry-delay 3             https://solivoc.ru/js/admin-20260821.js | grep -q 'adminBackup'
