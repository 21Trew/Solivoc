name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.xml"
      - "*.txt"
      - "sw.js"
      - "*.webmanifest"
      - "data/**"
      - "icons/**"
      - "js/**"
      - "styles/**"
      - "scripts/build-frontend.mjs"
      - "package.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA:0:12}"

          test -f dist-frontend/admin.html
          test -f dist-frontend/about.html
          test -f dist-frontend/robots.txt
          test -f dist-frontend/sitemap.xml
          test -f dist-frontend/js/admin.js
          test -f dist-frontend/js/runtime-config.js
          test -f dist-frontend/sw.js

          grep -q 'adminBackup' dist-frontend/js/admin.js
          grep -q 'rel="canonical" href="https://solivoc.ru/"' dist-frontend/index.html
          grep -q 'application/ld+json' dist-frontend/index.html
          grep -q 'Sitemap: https://solivoc.ru/sitemap.xml' dist-frontend/robots.txt
          grep -q '<loc>https://solivoc.ru/about.html</loc>' dist-frontend/sitemap.xml
          grep -q "js/admin.js?v=${BUILD_ID}" dist-frontend/admin.html
          grep -q 'solivoc-pwa-update-requested-v2' dist-frontend/js/runtime-config.js
          grep -q "worditaire-build-${BUILD_ID}" dist-frontend/sw.js

          test ! -e dist-frontend/admin-backup.html
          test ! -e dist-frontend/js/admin-backup.js
          test ! -e dist-frontend/js/admin-20260821.js

      - name: Upload frontend assets
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ vars.YC_BUCKET }}
          root: ./dist-frontend
          include: '**/*'
          exclude: 'sw.js'
          clear: false
          skip-unchanged: true
          fail-on-error: true
          cache-control: |
            *.html: no-cache
            js/runtime-config.js: no-cache
            **/*.js, **/*.css: no-cache
            **/*.json, **/*.webmanifest: no-cache
            *.xml, *.txt: no-cache
            *: public, max-age=3600

      # Publish the service worker only after every asset it will cache is
      # already present in Object Storage. This prevents mixed generations.
      - name: Publish service worker last
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ vars.YC_BUCKET }}
          root: ./dist-frontend
          include: 'sw.js'
          clear: false
          skip-unchanged: false
          fail-on-error: true
          cache-control: |
            sw.js: no-cache
            *: no-cache

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA:0:12}"

          admin_html="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://solivoc.ru/admin.html?ci=${GITHUB_SHA}")"
          printf '%s' "$admin_html" | grep -q "js/admin.js?v=${BUILD_ID}"

          admin_js="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://solivoc.ru/js/admin.js?ci=${GITHUB_SHA}")"
          printf '%s' "$admin_js" | grep -q 'adminBackup'

          runtime_config="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://solivoc.ru/js/runtime-config.js?ci=${GITHUB_SHA}")"
          printf '%s' "$runtime_config" | grep -q 'solivoc-pwa-update-requested-v2'

          service_worker="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://solivoc.ru/sw.js?ci=${GITHUB_SHA}")"
          printf '%s' "$service_worker" | grep -q "worditaire-build-${BUILD_ID}"

          root_html="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache' "https://solivoc.ru/?ci=${GITHUB_SHA}")"
          printf '%s' "$root_html" | grep -q 'rel="canonical" href="https://solivoc.ru/"'
          printf '%s' "$root_html" | grep -q 'application/ld+json'

          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://solivoc.ru/robots.txt?ci=${GITHUB_SHA}" | grep -q 'Sitemap: https://solivoc.ru/sitemap.xml'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://solivoc.ru/sitemap.xml?ci=${GITHUB_SHA}" | grep -q '<loc>https://solivoc.ru/about.html</loc>'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://solivoc.ru/about.html?ci=${GITHUB_SHA}" | grep -q 'Словасьянс — игра в ассоциации'

          echo "Production frontend, PWA and SEO files are current."
