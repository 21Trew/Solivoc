name: Deploy API Gateway

on:
  push:
    branches: [main]
    paths:
      - "yandex/api-gateway.template.yaml"
      - "scripts/render-api-gateway.mjs"
      - ".github/workflows/deploy-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Render API Gateway specification
        env:
          YC_FUNCTION_ID: ${{ vars.YC_FUNCTION_ID }}
          YC_GATEWAY_INVOKER_SA_ID: ${{ vars.YC_GATEWAY_INVOKER_SA_ID }}
        run: node scripts/render-api-gateway.mjs "$RUNNER_TEMP/solivoc-api-gateway.yaml"

      - name: Deploy API Gateway specification
        shell: bash
        env:
          YC_SA_ID: ${{ vars.YC_SA_ID }}
          YC_GATEWAY_ID: ${{ vars.YC_GATEWAY_ID }}
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          github_oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value')"
          exchange_response="$(curl --fail --silent --show-error --request POST 'https://auth.yandex.cloud/oauth/token' --header 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${YC_SA_ID}" --data-urlencode "subject_token=${github_oidc_token}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$exchange_response" | jq -r '.access_token')"

          jq -n --rawfile spec "$RUNNER_TEMP/solivoc-api-gateway.yaml" '{updateMask:"openapiSpec",openapiSpec:$spec}' > "$RUNNER_TEMP/update-gateway.json"

          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/update-gateway-response.json" --write-out '%{http_code}' --request PATCH "https://serverless-apigateway.api.cloud.yandex.net/apigateways/v1/apigateways/${YC_GATEWAY_ID}" -H "Authorization: Bearer ${iam_token}" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/update-gateway.json")"
          if [ "$http_code" != "200" ]; then
            echo "API Gateway update request failed with HTTP ${http_code}"
            cat "$RUNNER_TEMP/update-gateway-response.json"
            exit 1
          fi

          operation_id="$(jq -r '.id' "$RUNNER_TEMP/update-gateway-response.json")"
          echo "API Gateway update operation: ${operation_id}"

          for attempt in $(seq 1 45); do
            operation_json="$(curl --fail --silent --show-error -H "Authorization: Bearer ${iam_token}" "https://operation.api.cloud.yandex.net/operations/${operation_id}")"
            done_flag="$(printf '%s' "$operation_json" | jq -r '.done // false')"
            if [ "$done_flag" = "true" ]; then
              error_message="$(printf '%s' "$operation_json" | jq -r '.error.message // ""')"
              if [ -n "$error_message" ]; then
                echo "API Gateway update failed: ${error_message}"
                printf '%s\n' "$operation_json" | jq '.error'
                exit 1
              fi
              echo "API Gateway specification updated successfully"
              exit 0
            fi
            echo "Waiting for API Gateway update (${attempt}/45)..."
            sleep 2
          done
          echo "API Gateway update timed out"
          exit 1

      - name: Smoke test API and CORS
        shell: bash
        run: |
          set -euo pipefail

          header_value() {
            local name="$1"
            local file="$2"
            local line
            line="$(grep -i -m1 "^${name}:" "$file" || true)"
            if [ -z "$line" ]; then
              return 0
            fi
            line="${line#*:}"
            printf '%s\n' "$line" | sed 's/^[[:space:]]*//; s/\r$//'
          }

          for attempt in $(seq 1 20); do
            actual_headers="$RUNNER_TEMP/solivoc-actual-headers.txt"
            preflight_headers="$RUNNER_TEMP/solivoc-preflight-headers.txt"

            if curl --fail --silent --show-error \
              --dump-header "$actual_headers" \
              --header 'Origin: https://solivoc.ru' \
              --header 'Cache-Control: no-cache' \
              "https://api.solivoc.ru/api/version?gateway_ci=${GITHUB_SHA}-${attempt}" \
              > "$RUNNER_TEMP/solivoc-version.json"; then

              build="$(jq -r '.build // ""' "$RUNNER_TEMP/solivoc-version.json")"

              curl --fail --silent --show-error \
                --request OPTIONS \
                --dump-header "$preflight_headers" \
                --output /dev/null \
                --header 'Origin: https://solivoc.ru' \
                --header 'Access-Control-Request-Method: POST' \
                --header 'Access-Control-Request-Headers: content-type, cache-control, x-solivoc-owner-token, x-solivoc-guest-token' \
                'https://api.solivoc.ru/api/admin' || true

              actual_origin="$(header_value 'Access-Control-Allow-Origin' "$actual_headers")"
              actual_credentials="$(header_value 'Access-Control-Allow-Credentials' "$actual_headers" | tr '[:upper:]' '[:lower:]')"
              preflight_origin="$(header_value 'Access-Control-Allow-Origin' "$preflight_headers")"
              preflight_credentials="$(header_value 'Access-Control-Allow-Credentials' "$preflight_headers" | tr '[:upper:]' '[:lower:]')"
              preflight_allowed_headers="$(header_value 'Access-Control-Allow-Headers' "$preflight_headers" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
              duel_headers_ok=false
              if [[ ",${preflight_allowed_headers}," == *",x-solivoc-owner-token,"* ]] \
                && [[ ",${preflight_allowed_headers}," == *",x-solivoc-guest-token,"* ]]; then
                duel_headers_ok=true
              fi

              if [ -n "$build" ] \
                && [ "$actual_origin" = "https://solivoc.ru" ] \
                && [ "$actual_credentials" = "true" ] \
                && [ "$preflight_origin" = "https://solivoc.ru" ] \
                && [ "$preflight_credentials" = "true" ] \
                && [ "$duel_headers_ok" = "true" ]; then
                echo "API Gateway and credentialed CORS are healthy. Build: ${build}"
                exit 0
              fi

              echo "Waiting for CORS rollout (${attempt}/20)"
              echo "  actual_origin=${actual_origin:-missing}"
              echo "  actual_credentials=${actual_credentials:-missing}"
              echo "  preflight_origin=${preflight_origin:-missing}"
              echo "  preflight_credentials=${preflight_credentials:-missing}"
              echo "  preflight_allowed_headers=${preflight_allowed_headers:-missing}"
            fi

            sleep 3
          done

          echo "API Gateway/CORS health check failed"
          echo "--- actual response headers ---"
          cat "$actual_headers" || true
          echo "--- preflight response headers ---"
          cat "$preflight_headers" || true
          exit 1
