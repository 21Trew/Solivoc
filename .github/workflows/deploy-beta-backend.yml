name: Deploy beta backend

on:
  push:
    branches:
      - forest-world-campaign-beta-check
    paths:
      - "api/**"
      - "yandex/index.mjs"
      - "scripts/build-yandex.mjs"
      - "package.json"
      - ".github/workflows/deploy-beta-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: solivoc-beta-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Beta

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build backend bundle
        run: npm run build:yandex

      - name: Create deploy archive
        shell: bash
        run: |
          set -euo pipefail
          cd yandex-function
          zip -qr "$RUNNER_TEMP/solivoc-beta-function.zip" . -x "*.DS_Store"
          test -s "$RUNNER_TEMP/solivoc-beta-function.zip"

      - name: Deploy beta function preserving configuration
        shell: bash
        env:
          YC_SA_ID: ${{ vars.YC_SA_ID }}
          YC_FUNCTION_ID: ${{ vars.YC_FUNCTION_ID }}
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          github_oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value')"

          exchange_response="$(curl --fail --silent --show-error --request POST 'https://auth.yandex.cloud/oauth/token' --header 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${YC_SA_ID}" --data-urlencode "subject_token=${github_oidc_token}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$exchange_response" | jq -r '.access_token')"

          curl --fail --silent --show-error --get 'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions:byTag' -H "Authorization: Bearer ${iam_token}" --data-urlencode "functionId=${YC_FUNCTION_ID}" --data-urlencode 'tag=$latest' > "$RUNNER_TEMP/current-function.json"

          jq 'if (.versions? | type) == "array" then .versions[0] else . end' "$RUNNER_TEMP/current-function.json" > "$RUNNER_TEMP/current-version.json"
          jq -e '.id and .functionId and .runtime and .entrypoint and .resources.memory' "$RUNNER_TEMP/current-version.json" > /dev/null

          previous_version_id="$(jq -r '.id' "$RUNNER_TEMP/current-version.json")"
          echo "Current beta function version: ${previous_version_id}"

          base64 -w 0 "$RUNNER_TEMP/solivoc-beta-function.zip" > "$RUNNER_TEMP/solivoc-beta-function.b64"

          jq --rawfile content "$RUNNER_TEMP/solivoc-beta-function.b64" '
            {
              functionId: .functionId,
              runtime: .runtime,
              description: (.description // ""),
              entrypoint: .entrypoint,
              resources: .resources,
              executionTimeout: (.executionTimeout // "5s"),
              serviceAccountId: (.serviceAccountId // ""),
              content: $content,
              environment: ((.environment // {}) + {
                API_HOST: "api-beta.solivoc.ru",
                APP_ORIGINS: "https://beta.solivoc.ru"
              }),
              namedServiceAccounts: (.namedServiceAccounts // {}),
              concurrency: (.concurrency // "0"),
              connectivity: (.connectivity // {}),
              secrets: (.secrets // []),
              logOptions: (.logOptions // {}),
              storageMounts: (.storageMounts // []),
              asyncInvocationConfig: (.asyncInvocationConfig // {}),
              tmpfsSize: (.tmpfsSize // "0"),
              mounts: (.mounts // []),
              metadataOptions: (.metadataOptions // {})
            }
            | with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
          ' "$RUNNER_TEMP/current-version.json" > "$RUNNER_TEMP/create-version.json"

          create_response="$(curl --fail --silent --show-error --request POST 'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions' -H "Authorization: Bearer ${iam_token}" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/create-version.json")"
          operation_id="$(printf '%s' "$create_response" | jq -r '.id')"
          test -n "$operation_id"
          test "$operation_id" != "null"

          for attempt in $(seq 1 45); do
            sleep 2
            latest_json="$(curl --fail --silent --show-error --get 'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions:byTag' -H "Authorization: Bearer ${iam_token}" --data-urlencode "functionId=${YC_FUNCTION_ID}" --data-urlencode 'tag=$latest')"
            candidate="$(printf '%s' "$latest_json" | jq -r 'if (.versions? | type) == "array" then (.versions[0].id // "") else (.id // "") end')"
            if [ -n "$candidate" ] && [ "$candidate" != "$previous_version_id" ]; then
              echo "New beta function version: ${candidate}"
              exit 0
            fi
            echo "Waiting for beta function rollout (${attempt}/45)..."
          done

          echo "Beta function rollout timed out"
          exit 1

      - name: Smoke test beta API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --header 'Cache-Control: no-cache' "https://api-beta.solivoc.ru/api/version?ci=${GITHUB_SHA}-${attempt}" > "$RUNNER_TEMP/solivoc-beta-version.json"; then
              build="$(jq -r '.build // ""' "$RUNNER_TEMP/solivoc-beta-version.json")"
              if [ -n "$build" ]; then
                echo "Beta API is healthy. Build: ${build}"
                exit 0
              fi
            fi
            echo "Waiting for beta API health check (${attempt}/20)..."
            sleep 3
          done
          echo "Beta API health check failed."
          exit 1
