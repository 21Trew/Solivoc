name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "yandex/index.mjs"
      - "scripts/build-yandex.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build backend bundle
        run: npm run build:yandex

      - name: Read current function configuration
        id: current
        shell: bash
        env:
          YC_SA_ID: ${{ vars.YC_SA_ID }}
          YC_FUNCTION_ID: ${{ vars.YC_FUNCTION_ID }}
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          github_oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value')"

          exchange_response="$(curl --fail --silent --show-error             --request POST             'https://auth.yandex.cloud/oauth/token'             --header 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "audience=${YC_SA_ID}"             --data-urlencode "subject_token=${github_oidc_token}"             --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$exchange_response" | jq -r '.access_token')"

          curl --fail --silent --show-error --get             'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions:byTag'             -H "Authorization: Bearer ${iam_token}"             --data-urlencode "functionId=${YC_FUNCTION_ID}"             --data-urlencode 'tag=$latest'             > /tmp/solivoc-current-function.json

          jq 'if (.versions? | type) == "array" then .versions[0] else . end'             /tmp/solivoc-current-function.json > /tmp/solivoc-current-version.json

          jq -e '.id and .runtime and .entrypoint' /tmp/solivoc-current-version.json > /dev/null

          unsupported="$(jq -r '
            [
              (if ((.namedServiceAccounts // {}) | length) > 0 then "namedServiceAccounts" else empty end),
              (if ((.storageMounts // []) | length) > 0 then "storageMounts" else empty end),
              (if ((.mounts // []) | length) > 0 then "mounts" else empty end),
              (if ((.tmpfsSize // "0") | tostring | tonumber? // 0) > 0 then "tmpfsSize" else empty end),
              (if ((.concurrency // "0") | tostring | tonumber? // 0) > 0 then "concurrency" else empty end)
            ] | join(",")
          ' /tmp/solivoc-current-version.json)"
          if [ -n "$unsupported" ]; then
            echo "Current function uses configuration that this workflow intentionally will not overwrite: $unsupported"
            exit 1
          fi

          runtime="$(jq -r '.runtime' /tmp/solivoc-current-version.json)"
          entrypoint="$(jq -r '.entrypoint' /tmp/solivoc-current-version.json)"
          memory_bytes="$(jq -r '.resources.memory // "134217728"' /tmp/solivoc-current-version.json)"
          memory_mb="$(( memory_bytes / 1048576 ))"
          timeout_raw="$(jq -r '.executionTimeout // "5s"' /tmp/solivoc-current-version.json)"
          timeout_seconds="${timeout_raw%s}"
          timeout_seconds="${timeout_seconds%%.*}"
          service_account="$(jq -r '.serviceAccountId // ""' /tmp/solivoc-current-version.json)"
          network_id="$(jq -r '.connectivity.networkId // ""' /tmp/solivoc-current-version.json)"
          logs_disabled="$(jq -r '.logOptions.disabled // false' /tmp/solivoc-current-version.json)"
          logs_group_id="$(jq -r '.logOptions.logGroupId // ""' /tmp/solivoc-current-version.json)"
          log_level="$(jq -r '(.logOptions.minLevel // "") | ascii_downcase' /tmp/solivoc-current-version.json)"

          while IFS= read -r secret_value; do
            [ -z "$secret_value" ] || echo "::add-mask::$secret_value"
          done < <(jq -r '.environment // {} | to_entries[] | .value' /tmp/solivoc-current-version.json)

          {
            echo "runtime=${runtime}"
            echo "entrypoint=${entrypoint}"
            echo "memory=${memory_mb}Mb"
            echo "timeout=${timeout_seconds}"
            echo "service_account=${service_account}"
            echo "network_id=${network_id}"
            echo "logs_disabled=${logs_disabled}"
            echo "logs_group_id=${logs_group_id}"
            echo "log_level=${log_level}"

            echo 'environment<<__SOLIVOC_ENV__'
            jq -r '.environment // {} | to_entries[] | "\(.key)=\(.value)"' /tmp/solivoc-current-version.json
            echo '__SOLIVOC_ENV__'

            echo 'secrets<<__SOLIVOC_SECRETS__'
            jq -r '.secrets // [] | .[] | select(.environmentVariable != null) |
              "\(.environmentVariable)=\(.id)/\(.versionId)/\(.key)"' /tmp/solivoc-current-version.json
            echo '__SOLIVOC_SECRETS__'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Yandex Cloud Function
        id: function
        uses: yc-actions/yc-sls-function@v5
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          function-name: ${{ vars.YC_FUNCTION_NAME }}
          runtime: ${{ steps.current.outputs.runtime }}
          entrypoint: ${{ steps.current.outputs.entrypoint }}
          memory: ${{ steps.current.outputs.memory }}
          execution-timeout: ${{ steps.current.outputs.timeout }}
          service-account: ${{ steps.current.outputs.service_account }}
          network-id: ${{ steps.current.outputs.network_id }}
          logs-disabled: ${{ steps.current.outputs.logs_disabled }}
          logs-group-id: ${{ steps.current.outputs.logs_group_id }}
          log-level: ${{ steps.current.outputs.log_level }}
          environment: ${{ steps.current.outputs.environment }}
          secrets: ${{ steps.current.outputs.secrets }}
          source-root: ./yandex-function
          include: |
            .
          exclude: |
            **/.DS_Store

      - name: Smoke test API
        run: |
          curl --fail --silent --show-error             --retry 8 --retry-delay 3             https://api.solivoc.ru/api/version > /tmp/solivoc-version.json
          jq -e '.build' /tmp/solivoc-version.json > /dev/null
