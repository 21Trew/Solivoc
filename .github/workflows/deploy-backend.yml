name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "yandex/index.mjs"
      - "scripts/build-yandex.mjs"
      - "package.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build backend bundle
        run: npm run build:yandex

      - name: Create deploy archive
        shell: bash
        run: |
          set -euo pipefail
          cd yandex-function
          zip -qr "$RUNNER_TEMP/solivoc-function.zip" . -x "*.DS_Store"
          test -s "$RUNNER_TEMP/solivoc-function.zip"

      - name: Deploy function preserving current configuration
        id: function
        shell: bash
        env:
          YC_SA_ID: ${{ vars.YC_SA_ID }}
          YC_FUNCTION_ID: ${{ vars.YC_FUNCTION_ID }}
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          github_oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value')"

          exchange_response="$(curl --fail --silent --show-error             --request POST             'https://auth.yandex.cloud/oauth/token'             --header 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "audience=${YC_SA_ID}"             --data-urlencode "subject_token=${github_oidc_token}"             --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          iam_token="$(printf '%s' "$exchange_response" | jq -r '.access_token')"

          curl --fail --silent --show-error --get             'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions:byTag'             -H "Authorization: Bearer ${iam_token}"             --data-urlencode "functionId=${YC_FUNCTION_ID}"             --data-urlencode 'tag=$latest'             > "$RUNNER_TEMP/current-function.json"

          jq 'if (.versions? | type) == "array" then .versions[0] else . end'             "$RUNNER_TEMP/current-function.json"             > "$RUNNER_TEMP/current-version.json"

          jq -e '.id and .functionId and .runtime and .entrypoint and .resources.memory'             "$RUNNER_TEMP/current-version.json" > /dev/null

          previous_version_id="$(jq -r '.id' "$RUNNER_TEMP/current-version.json")"
          concurrency="$(jq -r '.concurrency // "0"' "$RUNNER_TEMP/current-version.json")"
          echo "Current function version: ${previous_version_id}"
          echo "Preserving concurrency: ${concurrency}"

          while IFS= read -r secret_value; do
            [ -z "$secret_value" ] || echo "::add-mask::$secret_value"
          done < <(jq -r '.environment // {} | to_entries[] | .value' "$RUNNER_TEMP/current-version.json")

          base64 -w 0 "$RUNNER_TEMP/solivoc-function.zip"             > "$RUNNER_TEMP/solivoc-function.b64"

          jq --rawfile content "$RUNNER_TEMP/solivoc-function.b64" '
            {
              functionId: .functionId,
              runtime: .runtime,
              description: (.description // ""),
              entrypoint: .entrypoint,
              resources: .resources,
              executionTimeout: (.executionTimeout // "5s"),
              serviceAccountId: (.serviceAccountId // ""),
              content: $content,
              environment: (.environment // {}),
              namedServiceAccounts: (.namedServiceAccounts // {}),
              concurrency: (.concurrency // "0"),
              connectivity: (.connectivity // {}),
              secrets: (.secrets // []),
              logOptions: (.logOptions // {}),
              storageMounts: (.storageMounts // []),
              asyncInvocationConfig: (.asyncInvocationConfig // {}),
              tmpfsSize: (.tmpfsSize // "0"),
              mounts: (.mounts // []),
              metadataOptions: (.metadataOptions // {})
            }
            | with_entries(
                select(
                  .value != null
                  and .value != ""
                  and .value != []
                  and .value != {}
                )
              )
          ' "$RUNNER_TEMP/current-version.json"             > "$RUNNER_TEMP/create-version.json"

          create_response="$(curl --fail --silent --show-error             --request POST             'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions'             -H "Authorization: Bearer ${iam_token}"             -H 'Content-Type: application/json'             --data-binary "@$RUNNER_TEMP/create-version.json")"

          operation_id="$(printf '%s' "$create_response" | jq -r '.id')"
          if [ -z "$operation_id" ] || [ "$operation_id" = "null" ]; then
            echo "Yandex did not return an operation ID"
            exit 1
          fi
          echo "CreateVersion operation: ${operation_id}"

          new_version_id=""
          for attempt in $(seq 1 45); do
            sleep 2
            latest_json="$(curl --fail --silent --show-error --get               'https://serverless-functions.api.cloud.yandex.net/functions/v1/versions:byTag'               -H "Authorization: Bearer ${iam_token}"               --data-urlencode "functionId=${YC_FUNCTION_ID}"               --data-urlencode 'tag=$latest')"

            candidate="$(printf '%s' "$latest_json" | jq -r '
              if (.versions? | type) == "array"
              then (.versions[0].id // "")
              else (.id // "")
              end
            ')"

            if [ -n "$candidate" ] && [ "$candidate" != "$previous_version_id" ]; then
              new_version_id="$candidate"
              break
            fi

            echo "Waiting for new \$latest version (${attempt}/45)..."
          done

          if [ -z "$new_version_id" ]; then
            echo "New function version was not promoted to \$latest in time."
            echo "Check Yandex Cloud operation: ${operation_id}"
            exit 1
          fi

          echo "New function version: ${new_version_id}"
          echo "version_id=${new_version_id}" >> "$GITHUB_OUTPUT"

      - name: Smoke test API
        shell: bash
        env:
          EXPECTED_VERSION_ID: ${{ steps.function.outputs.version_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error               https://api.solivoc.ru/api/version               > "$RUNNER_TEMP/solivoc-version.json"; then
              build="$(jq -r '.build // ""' "$RUNNER_TEMP/solivoc-version.json")"
              deployment="$(jq -r '.deployment // ""' "$RUNNER_TEMP/solivoc-version.json")"
              echo "API build: ${build}"
              echo "API deployment: ${deployment}"

              if [ -n "$build" ] && [ "$deployment" = "$EXPECTED_VERSION_ID" ]; then
                exit 0
              fi
            fi

            echo "Waiting for API Gateway to serve the new \$latest version (${attempt}/20)..."
            sleep 3
          done

          echo "Production API did not switch to expected function version: ${EXPECTED_VERSION_ID}"
          exit 1
