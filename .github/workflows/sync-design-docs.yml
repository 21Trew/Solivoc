name: Sync forest design docs

on:
  push:
    branches:
      - "milestone/forest-foundation"
    paths:
      - ".github/workflows/sync-design-docs.yml"
      - ".sync/docs.b64"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "milestone/forest-foundation"
          fetch-depth: 0
      - name: Decode and extract
        shell: bash
        run: |
          base64 -d .sync/docs.b64 > /tmp/docs.tar.bz2
          bzip2 -tv /tmp/docs.tar.bz2
          tar -xjf /tmp/docs.tar.bz2 -C .
          find docs/design -type f | sort
      - name: Commit canonical docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs RARITY_SYSTEM.md MASCOTS_README.md
          git rm -f .sync/docs.b64 .sync/milestone_docs.tar.bz2 .github/workflows/sync-design-docs.yml
          git commit -m "docs: sync forest foundation"
          git push origin HEAD:milestone/forest-foundation
