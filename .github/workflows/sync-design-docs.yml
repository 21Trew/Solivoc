name: Inspect forest docs payload

on:
  push:
    branches:
      - "milestone/forest-foundation"
    paths:
      - ".sync/docs.b64"
      - ".github/workflows/sync-design-docs.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "milestone/forest-foundation"
          fetch-depth: 0
      - name: Decode and inspect
        shell: bash
        run: |
          base64 -d .sync/docs.b64 > /tmp/docs.tar.bz2
          bzip2 -tv /tmp/docs.tar.bz2
          echo "--- CONTENTS ---"
          tar -tjf /tmp/docs.tar.bz2
