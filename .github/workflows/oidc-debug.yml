name: Diagnose Yandex OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Inspect safe OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}")"

          token="$(printf '%s' "$response" | jq -r '.value')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "GitHub did not return an OIDC token"
            exit 1
          fi

          export OIDC_TOKEN="$token"
          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref", "environment"):
              print(f"{key}={claims.get(key)}")
          PY

      - name: Test Yandex token exchange
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(printf '%s' "$response" | jq -r '.value')"

          http_code="$(curl --silent --show-error             --output /tmp/yandex-exchange.json             --write-out '%{http_code}'             --request POST             'https://auth.yandex.cloud/oauth/token'             --header 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode 'audience=${{ vars.YC_SA_ID }}'             --data-urlencode "subject_token=${token}"             --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"

          echo "Yandex token exchange HTTP ${http_code}"

          if [ "$http_code" != "200" ]; then
            python3 - <<'PY'
          import json

          with open("/tmp/yandex-exchange.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("error=" + str(data.get("error")))
          print("error_description=" + str(data.get("error_description")))
          PY
            exit 1
          fi

          echo "Yandex token exchange succeeded"
