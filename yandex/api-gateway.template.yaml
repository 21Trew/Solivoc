openapi: 3.0.0
info:
  title: Словасьянс API
  version: 1.0.0

paths:
  /api/{endpoint}:
    x-yc-apigateway-cors:
      origin:
        - https://solivoc.ru
        - https://www.solivoc.ru
        - https://admin.solivoc.ru
      methods:
        - GET
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
        - Cache-Control
        - Pragma
        - X-Solivoc-Owner-Token
        - X-Solivoc-Guest-Token
      credentials: true
      maxAge: 3600
      optionsSuccessStatus: 204

    x-yc-apigateway-any-method:
      summary: Slovasyans API endpoint
      operationId: solivocApi
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <FUNCTION_ID>
        service_account_id: <SERVICE_ACCOUNT_ID>
        tag: $latest
        payload_format_version: "2.0"

  /api/admin/mail:
    x-yc-apigateway-cors:
      origin:
        - https://admin.solivoc.ru
      methods:
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Cache-Control
        - Pragma
      credentials: true
      maxAge: 3600
      optionsSuccessStatus: 204

    x-yc-apigateway-any-method:
      summary: Admin developer mail endpoint
      operationId: solivocAdminDeveloperMail
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <FUNCTION_ID>
        service_account_id: <SERVICE_ACCOUNT_ID>
        tag: $latest
        payload_format_version: "2.0"

  /d/{code}:
    x-yc-apigateway-any-method:
      summary: Public duel share page
      operationId: duelShare
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <FUNCTION_ID>
        service_account_id: <SERVICE_ACCOUNT_ID>
        tag: $latest
        payload_format_version: "2.0"
