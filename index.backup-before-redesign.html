<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#174b37" />
<title>Ассоциации — Косынка</title>
<style>
:root{
  --felt:#1e684b;--felt2:#154835;--card:#fffdf8;--ink:#202832;--muted:#69737d;
  --violet:#665ee0;--danger:#e05959;--ok:#43cf84;
  --cols:4;--gap:5px;--cw:54px;--ch:84px;
  --down-step:19px;--up-step:34px;--radius:12px;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:#0d2a20;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit}.app{height:100dvh;max-width:780px;margin:auto;padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;background:linear-gradient(145deg,var(--felt),var(--felt2))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand b{font-size:17px}.brand small{display:block;font-size:10px;opacity:.72}.stats{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}.pill{padding:5px 8px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff20;font-size:10px;white-space:nowrap}
.game-scroll{min-height:0;overflow:hidden;border:1px solid #ffffff1c;border-radius:16px;background:#0000000d;touch-action:none}.game{width:100%;height:100%;min-height:0;padding:9px;overflow:hidden}
.game{display:flex;flex-direction:column}.draw-row{display:flex;align-items:center;gap:var(--gap);padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid #ffffff26}.draw-label{margin-left:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.62}.draw-area{display:grid;grid-template-columns:repeat(2,var(--cw));gap:var(--gap)}.category-row{padding-bottom:11px;margin-bottom:10px;border-bottom:2px solid #ffffff2b}.category-area{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));justify-content:end;gap:var(--gap);width:100%}.tableau{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),var(--cw));justify-content:end;gap:var(--gap);align-items:start;width:100%}
.slot,.stock,.waste{position:relative;width:var(--cw);height:var(--ch);border-radius:var(--radius)}.slot.empty,.waste.empty,.stock.empty{border:2px dashed #ffffff30;background:#ffffff08}.slot.empty::after{content:"КАТ.";position:absolute;inset:0;display:grid;place-items:center;color:#ffffff5f;font-size:11px;font-weight:800}.stock.empty::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;color:#ffffff84;font-size:28px}.waste.empty::after{content:"СБРОС";position:absolute;inset:0;display:grid;place-items:center;color:#ffffff55;font-size:9px;font-weight:800}
.column{position:relative;width:var(--cw);min-width:var(--cw);height:100%;min-height:var(--ch);border-radius:var(--radius)}.column.empty::before{content:"";position:absolute;inset:0 0 auto;height:var(--ch);border:2px dashed #ffffff30;border-radius:var(--radius)}
.card{position:absolute;left:0;top:var(--y,0px);width:var(--cw);height:var(--ch);border-radius:var(--radius);border:1px solid #0002;box-shadow:0 5px 12px #04150f45;background:linear-gradient(#fff,#f1ede5);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;font-size:11px;line-height:1.08;font-weight:780;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;touch-action:none;transition:transform .14s,filter .14s,opacity .14s}
.card.face-down{background:repeating-linear-gradient(45deg,#554dc0 0 7px,#736be1 7px 14px);border:3px solid #eeeaff;color:transparent}.card.face-down::after{content:"✦";display:grid;place-items:center;width:55%;aspect-ratio:1;border:2px solid #ffffffad;border-radius:50%;color:#fff;font-size:20px}.card.category{background:linear-gradient(145deg,#756dff,#4f47c4);color:#fff;border-color:#453db4;flex-direction:column;gap:4px;text-transform:uppercase}.card.category .name{font-size:10px;line-height:1.02;overflow-wrap:anywhere;word-break:break-word}.card.category .count{font-size:12px;opacity:.9;flex:0 0 auto}.card.movable{cursor:grab}.card.drag-source{visibility:hidden}.card.hint{animation:pulse .75s ease 2}
.stock .card,.waste .card,.slot .card{top:0}.stock-count{position:absolute;right:4px;bottom:4px;z-index:4;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#081812d9;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
@keyframes pulse{50%{transform:translateY(-7px);filter:brightness(1.15)}}
.drag-stack{position:fixed;z-index:9999;pointer-events:none;width:var(--cw);height:calc(var(--ch) + 22px);transform:translate(-50%,-26px) rotate(1.5deg);filter:drop-shadow(0 17px 18px #0007)}.drag-stack .shadow-card{position:absolute;left:0;top:calc(var(--i)*6px);width:100%;height:var(--ch);border-radius:var(--radius);border:1px solid #0002;background:#ded9d0}.drag-stack .drag-main{position:absolute;left:0;top:18px;width:var(--cw);height:var(--ch);border-radius:var(--radius);border:1px solid #0002;background:linear-gradient(#fff,#eee9df);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-size:11px;line-height:1.08;font-weight:780;z-index:5;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}.drag-stack .drag-main.category{background:linear-gradient(145deg,#756dff,#4f47c4);color:#fff;flex-direction:column;gap:4px}.drag-stack .drag-count{position:absolute;right:-7px;top:7px;z-index:8;min-width:30px;height:24px;padding:0 7px;border-radius:999px;background:#101b17;color:#fff;border:2px solid #fff;display:grid;place-items:center;font-size:10px;font-weight:900}
.controls{display:flex;gap:5px}.controls button{flex:1;min-height:43px;border:0;border-radius:12px;background:#ffffffec;color:#17251f;font-weight:780;padding:0 6px}.controls .primary{background:#6c64e8;color:#fff}.controls button:disabled{opacity:.42}
.toast{position:fixed;left:50%;bottom:73px;z-index:10000;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.18s;background:#0a1511ed;color:#fff;border-radius:999px;padding:9px 13px;font-size:11px;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:11000;display:none;place-items:center;background:#06110ccb;padding:20px}.modal.show{display:grid}.modal-card{max-width:330px;padding:23px;border-radius:20px;background:#fff;color:#17211d;text-align:center}.modal-card h2{margin:0 0 8px}.modal-card button{border:0;border-radius:12px;background:#665ee0;color:#fff;padding:12px 18px;font-weight:800}
@media(max-height:650px){:root{--up-step:30px;--down-step:17px}.app{gap:5px}.controls button{min-height:39px}.category-row{margin-bottom:7px;padding-bottom:8px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Ассоциации</b><small>косынка со словами</small></div>
    <div class="stats"><span class="pill">Ур. <b id="level">1</b></span><span class="pill"><b id="cols">4</b> кол.</span><span class="pill">Карт: <b id="left">0</b></span></div>
  </header>
  <main class="game-scroll"><div class="game">
    <section class="draw-row">
      <div class="draw-area">
        <div class="stock" id="stock"></div>
        <div class="waste empty" id="waste"></div>
      </div>
      <span class="draw-label">Колода и сброс</span>
    </section>
    <section class="category-row">
      <div class="category-area" id="slotsAnchor"></div>
    </section>
    <section class="tableau" id="tableau"></section>
  </div></main>
  <footer class="controls"><button id="undo">↶ Отмена</button><button id="hint">✦ Подсказка</button><button class="primary" id="restart">Новый расклад</button></footer>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-card"><h2>Уровень пройден!</h2><p>Все категории собраны.</p><button id="next">Следующий уровень</button></div></div>
<script src="data/categories.js"></script>
<script>
let BANK=[];
const RECENT_KEY='assoc-recent-categories-v1';
const normWord=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim();
function getRecentCategories(){try{return JSON.parse(localStorage.getItem(RECENT_KEY))||[]}catch{return[]}}
function rememberCategories(ids){const recent=getRecentCategories().filter(id=>!ids.includes(id));localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent].slice(0,40)))}
function categoriesConflict(a,b){
 if(!a||!b)return false;
 if(a.conflictGroup&&a.conflictGroup===b.conflictGroup)return true;
 if(a.conflicts?.includes(b.id)||b.conflicts?.includes(a.id))return true;
 const aw=new Set(a.words.map(normWord));
 return b.words.some(w=>aw.has(normWord(w)));
}
function chooseCompatibleCategories(count){
 const recent=new Set(getRecentCategories());
 const attempt=(avoidRecent)=>{
   for(let pass=0;pass<250;pass++){
     const pool=shuffle(BANK).filter(c=>!avoidRecent||!recent.has(c.id)),chosen=[];
     for(const cat of pool){
       if(chosen.every(existing=>!categoriesConflict(cat,existing)))chosen.push(cat);
       if(chosen.length===count)return chosen;
     }
   }
   return null;
 };
 return attempt(true)||attempt(false)||[];
}
async function loadCategoryBank(){
 try{
   const r=await fetch('./data/categories.json',{cache:'no-store'});
   if(!r.ok)throw new Error('categories.json '+r.status);
   const data=await r.json();
   if(!Array.isArray(data.categories)||data.categories.length<100)throw new Error('invalid category bank');
   BANK=data.categories;
 }catch(err){
   console.warn('Не удалось загрузить categories.json, использую локальный резерв.',err);
   BANK=Array.isArray(window.CATEGORY_BANK)?window.CATEGORY_BANK:[];
 }
 if(!BANK.length)throw new Error('База категорий не загружена');
}

const $=s=>document.querySelector(s),tableau=$('#tableau'),slotsAnchor=$('#slotsAnchor'),stockEl=$('#stock'),wasteEl=$('#waste'),toast=$('#toast'),modal=$('#modal');
let state,history=[],drag=null;
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function config(level){const cols=rnd(3,6),ranges={3:[3,4],4:[4,6],5:[6,8],6:[8,12]};return{cols,cats:rnd(...ranges[cols])}}
function makeLevel(level=1){
 const cfg=config(level),chosen=chooseCompatibleCategories(cfg.cats),cards=[];
 if(chosen.length<cfg.cats){showToast('Не удалось собрать совместимый набор категорий');return}
 chosen.forEach(cat=>{const n=rnd(3,Math.min(9,cat.words.length)),words=shuffle(cat.words).slice(0,n);cards.push({uid:uid(),cat:cat.id,label:cat.title,type:'category',total:n});words.forEach(w=>cards.push({uid:uid(),cat:cat.id,label:w,type:'word',total:n}))});
 const deck=shuffle(cards),layoutCount=Math.max(cfg.cols,Math.floor(deck.length/2)),layoutCards=deck.splice(0,layoutCount),counts=randomColumnCounts(layoutCount,cfg.cols),columns=[];
 let cursor=0;
 counts.forEach(count=>{const chunk=layoutCards.slice(cursor,cursor+count);cursor+=count;columns.push(chunk.map((card,i)=>({cards:[card],faceUp:i===count-1}))) });
 state={level,cols:cfg.cols,columns,stock:deck,waste:[],slots:Array(cfg.cols).fill(null),completed:0,totalCategories:cfg.cats,categoryIds:chosen.map(c=>c.id)};rememberCategories(state.categoryIds);history=[];render();
}
function randomColumnCounts(total,cols){
 const counts=Array(cols).fill(1);let rest=total-cols;
 while(rest>0){counts[rnd(0,cols-1)]++;rest--}
 for(let i=0;i<cols*4;i++){const a=rnd(0,cols-1),b=rnd(0,cols-1);if(a!==b&&counts[a]>1&&Math.random()<.72){counts[a]--;counts[b]++}}
 if(new Set(counts).size===1&&total>cols){counts[0]--;counts[cols-1]++}
 return shuffle(counts);
}
function snapshot(){return structuredClone(state)}
function pushHistory(){history.push(snapshot());if(history.length>80)history.shift()}
function save(){localStorage.setItem('assoc-klondike-v6',JSON.stringify(state))}
function load(){try{const s=JSON.parse(localStorage.getItem('assoc-klondike-v6'));if(s?.columns&&Array.isArray(s.slots)){state=s;render();return}}catch{}makeLevel(1)}
function catOfGroup(g){return g.cards[0].cat}function categoryCard(g){return g.cards.find(c=>c.type==='category')}function wordCount(g){return g.cards.filter(c=>c.type==='word').length}
function groupLabel(g){const cc=categoryCard(g);return cc?`${cc.label} ${wordCount(g)}/${cc.total}`:g.cards[0].label}
function canMerge(a,b){return a&&b&&catOfGroup(a)===catOfGroup(b)}
function firstOpenIndex(col){const i=col.findIndex(g=>g.faceUp);return i<0?col.length:i}
function hasOpenStack(col){return firstOpenIndex(col)<col.length}
function revealLast(col){if(col.length&&!col[col.length-1].faceUp)col[col.length-1].faceUp=true}
function cardNode(g,extra=''){const card=document.createElement('div'),cc=categoryCard(g);card.className=`card ${extra}${cc?' category':''}`.trim();if(cc)card.innerHTML=`<span class="name">${cc.label}</span><span class="count">${wordCount(g)}/${cc.total}</span>`;else card.textContent=g.cards[0].label;card.title=g.cards.map(c=>c.label).join(', ');return card}

function fitText(el,min=6,max=10){
 if(!el)return;
 let size=max;
 el.style.fontSize=size+'px';
 while(size>min&&(el.scrollHeight>el.clientHeight||el.scrollWidth>el.clientWidth)){
   size-=0.5;
   el.style.fontSize=size+'px';
 }
}
function fitAllCardText(root=document){
 root.querySelectorAll('.card:not(.face-down):not(.category), .drag-main:not(.category)').forEach(el=>fitText(el,7,11));
 root.querySelectorAll('.card.category .name, .drag-main.category span:first-child').forEach(el=>fitText(el,7,10));
}
function colY(col,index){const cs=getComputedStyle(document.documentElement),down=parseInt(cs.getPropertyValue('--down-step')),up=parseInt(cs.getPropertyValue('--up-step'));let y=0;for(let i=0;i<index;i++)y+=col[i].faceUp?Math.max(1,col[i].cards.length)*up:down;return y}
function render(){
 document.documentElement.style.setProperty('--cols',state.cols);tableau.innerHTML='';slotsAnchor.innerHTML='';
 state.slots.forEach((g,i)=>{const slot=document.createElement('div');slot.className='slot '+(g?'':'empty');slot.dataset.zone='slot';slot.dataset.index=i;if(g){const card=cardNode(g,'movable');card.dataset.source='slot';card.dataset.index=i;slot.appendChild(card)}slotsAnchor.appendChild(slot)});
 stockEl.innerHTML='';stockEl.className='stock '+(state.stock.length?'':'empty');if(state.stock.length){const back=document.createElement('div');back.className='card face-down';stockEl.appendChild(back);const n=document.createElement('span');n.className='stock-count';n.textContent=state.stock.length;stockEl.appendChild(n)}
 wasteEl.innerHTML='';wasteEl.className='waste '+(state.waste.length?'':'empty');if(state.waste.length){const g={cards:[state.waste[state.waste.length-1]],faceUp:true},card=cardNode(g,'movable');card.dataset.source='waste';wasteEl.appendChild(card)}
 state.columns.forEach((col,ci)=>{const el=document.createElement('div');el.className='column '+(col.length?'':'empty');el.dataset.zone='column';el.dataset.index=ci;col.forEach((g,gi)=>{const baseY=colY(col,gi);if(!g.faceUp){const card=document.createElement('div');card.className='card face-down';card.style.setProperty('--y',baseY+'px');el.appendChild(card)}else{g.cards.forEach((single,si)=>{const visual={cards:[single],faceUp:true},card=cardNode(visual,'movable');card.dataset.source='column';card.dataset.col=ci;card.dataset.index=gi;card.dataset.cardIndex=si;card.style.setProperty('--y',(baseY+si*parseInt(getComputedStyle(document.documentElement).getPropertyValue('--up-step')))+'px');card.style.zIndex=String(10+gi*10+si);el.appendChild(card)})}});tableau.appendChild(el)});
 const left=state.stock.length+state.waste.length+state.columns.reduce((n,c)=>n+c.reduce((m,g)=>m+g.cards.length,0),0)+state.slots.reduce((n,g)=>n+(g?g.cards.length:0),0);
 fitAllCardText();$('#level').textContent=state.level;$('#cols').textContent=state.cols;$('#left').textContent=left;$('#undo').disabled=!history.length;save();if(state.completed===state.totalCategories)modal.classList.add('show')
}
function drawStock(){pushHistory();if(state.stock.length){state.waste.push(state.stock.pop())}else if(state.waste.length){state.stock=state.waste.reverse();state.waste=[]}else{history.pop();return}render()}
stockEl.addEventListener('click',e=>{if(drag)return;drawStock()});
function getDragPayload(card){const source=card.dataset.source;if(source==='column'){const ci=+card.dataset.col,col=state.columns[ci],start=firstOpenIndex(col);if(start>=col.length)return null;return{source,ci,start,groups:col.slice(start)}}if(source==='waste'){const c=state.waste[state.waste.length-1];return{source,groups:[{cards:[c],faceUp:true}]}}if(source==='slot'){const si=+card.dataset.index;return{source,si,groups:[state.slots[si]]}}return null}
function targetFromPoint(x,y){const e=document.elementFromPoint(x,y);return e?.closest('[data-zone]')||e?.closest('.waste')||null}
function payloadGroup(p){const cards=[];p.groups.forEach(g=>cards.push(...g.cards));return{cards,faceUp:true}}
function canDrop(p,target){if(!target)return false;const zone=target.dataset.zone,idx=+target.dataset.index,moving=payloadGroup(p),cc=categoryCard(moving);
 if(zone==='slot'){
   const dest=state.slots[idx];
   if(!dest)return !!cc;
   return canMerge(dest,moving)&&!!categoryCard(dest);
 }
 if(zone==='column'){
   if(cc)return false;
   const col=state.columns[idx];if(p.source==='column'&&p.ci===idx)return false;
   if(!col.length)return !cc;
   const last=col[col.length-1];return last.faceUp&&canMerge(last,moving);
 }
 return false
}
function detachPayload(p){if(p.source==='column'){const col=state.columns[p.ci],start=firstOpenIndex(col),groups=col.slice(start);col.splice(start);revealLast(col);return groups}if(p.source==='waste'){return[{cards:[state.waste.pop()],faceUp:true}]}if(p.source==='slot'){const g=state.slots[p.si];state.slots[p.si]=null;return[g]}return[]}
function completeSlot(i){const g=state.slots[i],cc=g&&categoryCard(g);if(cc&&wordCount(g)===cc.total){state.slots[i]=null;state.completed++;showToast(`${cc.label}: собрано!`)}}
function performDrop(p,target){if(!canDrop(p,target))return false;pushHistory();const groups=detachPayload(p),moving={cards:groups.flatMap(g=>g.cards),faceUp:true},zone=target.dataset.zone,idx=+target.dataset.index;
 if(zone==='slot'){if(state.slots[idx])state.slots[idx].cards.push(...moving.cards);else state.slots[idx]=moving;completeSlot(idx)}else{const col=state.columns[idx];if(col.length)col[col.length-1].cards.push(...moving.cards);else col.push(moving)}render();return true}
function startDrag(e){const card=e.target.closest('.card.movable');if(!card)return;e.preventDefault();const payload=getDragPayload(card);if(!payload)return;drag={payload};let sourceNodes=[];if(payload.source==='column'){sourceNodes=[...document.querySelectorAll(`.card[data-source="column"][data-col="${payload.ci}"]`)]}else{sourceNodes=[card]}sourceNodes.forEach(node=>node.classList.add('drag-source'));const ghost=document.createElement('div');ghost.className='drag-stack';const totalCards=payload.groups.reduce((n,g)=>n+g.cards.length,0);const shadowCount=Math.min(3,Math.max(0,totalCards-1));for(let i=0;i<shadowCount;i++){const sh=document.createElement('div');sh.className='shadow-card';sh.style.setProperty('--i',i);ghost.appendChild(sh)}const topGroup=payload.groups[0],main=document.createElement('div'),cc=categoryCard(topGroup);main.className='drag-main'+(cc?' category':'');if(cc)main.innerHTML=`<span>${cc.label}</span><span>${wordCount(topGroup)}/${cc.total}</span>`;else main.textContent=topGroup.cards[0].label;ghost.appendChild(main);if(totalCards>1){const count=document.createElement('div');count.className='drag-count';count.textContent=`${totalCards} карт`;ghost.appendChild(count)}document.body.appendChild(ghost);fitAllCardText(ghost);drag.ghost=ghost;drag.sourceNodes=sourceNodes;moveDrag(e)}
function moveDrag(e){if(!drag)return;e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}
function endDrag(e){if(!drag)return;const t=targetFromPoint(e.clientX,e.clientY),d=drag;drag=null;d.ghost.remove();d.sourceNodes?.forEach(node=>node.classList.remove('drag-source'));if(!performDrop(d.payload,t)){showToast('Сюда положить нельзя');render()}}
document.addEventListener('pointerdown',startDrag);window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag);
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1350)}
$('#undo').onclick=()=>{if(history.length){state=history.pop();render()}};
$('#restart').onclick=()=>makeLevel(state?.level||1);
$('#next').onclick=()=>{modal.classList.remove('show');makeLevel((state?.level||1)+1)};
$('#hint').onclick=()=>{
 const payloads=[];state.columns.forEach((col,ci)=>{const start=firstOpenIndex(col);if(start<col.length)payloads.push({source:'column',ci,start,groups:col.slice(start)})});if(state.waste.length)payloads.push({source:'waste',groups:[{cards:[state.waste[state.waste.length-1]],faceUp:true}]});state.slots.forEach((g,si)=>{if(g)payloads.push({source:'slot',si,groups:[g]})});
 const targets=[...document.querySelectorAll('[data-zone]')];for(const p of payloads)for(const t of targets)if(canDrop(p,t)){let q;if(p.source==='column')q=`.card[data-source="column"][data-col="${p.ci}"][data-index="${p.start}"]`;else if(p.source==='waste')q='.waste .card';else q=`.slot[data-index="${p.si}"] .card`;const n=document.querySelector(q);n?.classList.add('hint');setTimeout(()=>n?.classList.remove('hint'),1600);showToast(`Ход: ${groupLabel(p.groups[0])}`);return}if(state.stock.length||state.waste.length)showToast('Открой следующую карту колоды');else showToast('Доступных ходов не найдено')
};
loadCategoryBank().then(load).catch(err=>{console.error(err);showToast('Ошибка загрузки базы категорий')});
