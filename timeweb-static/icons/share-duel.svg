<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24184f"/>
      <stop offset="0.52" stop-color="#4e4fd2"/>
      <stop offset="1" stop-color="#47bdd7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff49a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff49a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b0c2b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1080" cy="110" r="150" fill="#ffffff" opacity=".08"/>
  <circle cx="1020" cy="530" r="210" fill="#ffffff" opacity=".06"/>
  <g transform="translate(72 70)">
    <rect width="690" height="490" rx="54" fill="#15183d" opacity=".55" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <text x="58" y="96" fill="#ffe36e" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="800" letter-spacing="5">СЛОВАСЬЯНС</text>
    <text x="58" y="194" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="900">Дуэль ждёт тебя</text>
    <text x="58" y="265" fill="#dce6ff" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="600">Открой ссылку, собери тот же расклад</text>
    <text x="58" y="308" fill="#dce6ff" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="600">и сравни результат с другом.</text>
    <g transform="translate(58 366)">
      <rect width="322" height="76" rx="24" fill="#fff" opacity=".14" stroke="#fff" stroke-opacity=".24"/>
      <text x="30" y="50" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="800">Играть →</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <circle cx="950" cy="295" r="220" fill="#fff" opacity=".88"/>
    <image href="mascot-owl.svg" x="755" y="108" width="300" height="300"/>
    <image href="mascot-cat.svg" x="900" y="302" width="250" height="250"/>
  </g>
