<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#29205d" />
<title>Словасьянс — пасьянс ассоциаций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100d2a;--board:#1b1745;--board2:#141c47;--surface:#ffffff10;--surface2:#ffffff16;
  --ink:#171b38;--muted:#b1acd8;--accent:#7c5cff;--accent2:#a85cff;--cyan:#4ed7ff;
  --pink:#ff5fa2;--lime:#85e6a7;--yellow:#ffd85c;--danger:#ff6b78;
  --cols:4;--gap:5px;--cw:54px;--ch:84px;--down-step:9px;--up-step:9px;--radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  overflow:hidden;color:#fff;font-family:"Atkinson Hyperlegible Next","Nunito",ui-rounded,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  user-select:none;-webkit-user-select:none;background:
    radial-gradient(circle at 15% -10%,#7858ff55 0 23%,transparent 42%),
    radial-gradient(circle at 95% 15%,#ff5da94a 0 18%,transparent 40%),
    linear-gradient(155deg,#0b0920,#151034 58%,#0a1530);
}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{
  position:relative;isolation:isolate;height:100dvh;max-width:520px;margin:auto;
  padding:max(10px,env(safe-area-inset-top)) 9px max(9px,env(safe-area-inset-bottom));
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden;
  background:
    radial-gradient(circle at 85% 8%,#ca62ff2e,transparent 25%),
    radial-gradient(circle at 5% 42%,#3bcfff24,transparent 24%),
    linear-gradient(160deg,#29205d 0%,#1d1b50 44%,#151d4a 100%);
  box-shadow:0 0 80px #0008;
}
.app::before,.app::after{content:"";position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none;z-index:-1}
.app::before{width:170px;height:170px;right:-90px;top:22%;background:#ff5fa21a}
.app::after{width:150px;height:150px;left:-85px;bottom:12%;background:#4ed7ff14}
.hud{display:grid;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:42px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:18px;font-weight:950;
  background:linear-gradient(145deg,#9c6cff,#6d58ff 52%,#3c80ff);box-shadow:0 7px 18px #5c42ff55,inset 0 1px #fff8;border:1px solid #ffffff35}
.brand-copy{min-width:0}.brand b{display:block;font-size:17px;line-height:1.05;letter-spacing:-.025em}.brand small{display:block;margin-top:3px;font-size:8px;line-height:1;text-transform:uppercase;letter-spacing:.12em;color:#c9c6ed;white-space:nowrap}
.stats{display:flex;justify-content:flex-end;gap:5px;min-width:0}
.pill{height:30px;padding:0 8px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1f;box-shadow:inset 0 1px #ffffff16;display:flex;align-items:center;gap:3px;font-size:9px;color:#ece9ff;white-space:nowrap;backdrop-filter:blur(10px);font-weight:800}
.pill b{font-size:10px;color:#fff;font-weight:900}.pill.progress-pill{background:linear-gradient(135deg,#8d64ff30,#4ed7ff22);border-color:#a38cff46}
.progress-wrap{display:flex;align-items:center;gap:8px;padding:0 2px}
.progress-track{position:relative;flex:1;height:6px;border-radius:999px;background:#ffffff12;overflow:hidden;box-shadow:inset 0 1px 2px #0004}
.progress-bar{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,#4ed7ff,#8c65ff 48%,#ff67ad);box-shadow:0 0 14px #7f66ff88;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.progress-label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#aaa6d3;white-space:nowrap}
.game-scroll{min-height:0;overflow:hidden;border:1px solid #ffffff16;border-radius:22px;background:linear-gradient(180deg,#080a203d,#06091b26);box-shadow:inset 0 1px #ffffff0f,0 12px 30px #06061e38;touch-action:none;backdrop-filter:blur(8px)}
.game{width:100%;height:100%;min-height:0;padding:10px 8px 8px;overflow:hidden;display:flex;flex-direction:column}
.draw-row{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:11px;width:max-content;max-width:100%;border-radius:17px;background:#ffffff09;border:1px solid #ffffff12;box-shadow:inset 0 1px #ffffff0d}
.draw-label{margin-left:1px;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#c3bee9;white-space:nowrap;font-weight:800}.draw-area{display:grid;grid-template-columns:repeat(2,var(--cw));gap:var(--gap)}
.category-row{padding:0 0 11px;margin-bottom:10px;border-bottom:1px solid #ffffff10}.category-area{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));justify-content:end;gap:var(--gap);width:100%}
.tableau{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),var(--cw));justify-content:end;gap:var(--gap);align-items:start;width:100%}
.slot,.stock,.waste{position:relative;width:var(--cw);height:var(--ch);border-radius:var(--radius)}
.slot.empty,.waste.empty,.stock.empty{border:1.5px dashed #ffffff2d;background:linear-gradient(145deg,#ffffff08,#ffffff03);box-shadow:inset 0 1px #ffffff09}
.slot.empty::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:#ffffff44;font-size:22px;font-weight:500}
.stock.empty::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;color:#ffffff92;font-size:25px}
.waste.empty::after{content:"СБРОС";position:absolute;inset:0;display:grid;place-items:center;color:#ffffff50;font-size:8px;font-weight:850;letter-spacing:.06em}
.column{position:relative;width:var(--cw);min-width:var(--cw);height:100%;min-height:var(--ch);border-radius:var(--radius)}
.column.empty::before{content:"";position:absolute;inset:0 0 auto;height:var(--ch);border:1.5px dashed #ffffff20;border-radius:var(--radius);background:#ffffff03}
.card{position:absolute;left:0;top:var(--y,0px);width:var(--cw);height:var(--ch);border-radius:var(--radius);border:1px solid #ffffffea;
  box-shadow:0 4px 0 #09092325,0 8px 17px #04061745,inset 0 1px #fff,inset 0 -10px 18px rgba(127,111,189,.07);
  background:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.95) 0 7%,transparent 8%),
    radial-gradient(circle at 82% 86%,rgba(184,176,228,.14) 0 8%,transparent 9%),
    linear-gradient(165deg,#ffffff 0%,#fcfcff 54%,#f0edff 100%);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 5px;font-size:13px;line-height:1.0;font-weight:800;letter-spacing:-.015em;
  overflow:hidden;overflow-wrap:break-word;word-break:normal;hyphens:none;touch-action:none;
  transition:transform .14s cubic-bezier(.2,.8,.2,1),filter .14s,box-shadow .14s,opacity .14s}
.card:not(.face-down):not(.category)::before{content:"";position:absolute;left:7px;right:7px;top:5px;height:1px;background:#ffffff;border-radius:99px;opacity:.95}
.card:not(.face-down):not(.category)::after{content:"";position:absolute;inset:4px;border-radius:10px;border:1px solid rgba(128,117,190,.12);box-shadow:inset 0 1px rgba(255,255,255,.75);pointer-events:none}
.card.movable{cursor:grab}.card.movable:active{cursor:grabbing;transform:translateY(-1px) scale(1.015)}
.card.face-down{background:
  radial-gradient(circle at 30% 22%,#ffffff18 0 5%,transparent 6%),
  radial-gradient(circle at 72% 68%,#ffffff12 0 4%,transparent 5%),
  linear-gradient(145deg,#8b62ff 0%,#684dff 48%,#3c69e8 100%);
  border:2px solid #b8a9ff;box-shadow:0 4px 0 #32258a,0 8px 16px #06072266,inset 0 1px #ffffff88;color:transparent}
.card.face-down::before{content:"";position:absolute;inset:6px;border:1px solid #ffffff52;border-radius:10px;background:repeating-linear-gradient(45deg,#ffffff08 0 5px,transparent 5px 10px)}
.card.face-down::after{content:"✦";position:relative;display:grid;place-items:center;width:29px;height:29px;border:2px solid #ffffffb8;border-radius:10px;color:#fff;font-size:14px;transform:rotate(45deg);text-shadow:0 1px 3px #2b1a80}
.card.category{--h:var(--cat-hue,258);background:linear-gradient(155deg,hsl(var(--h) 84% 62%),hsl(calc(var(--h) + 18) 78% 46%));color:#fff;border-color:#ffffff85;box-shadow:0 4px 0 hsl(var(--h) 62% 24% / .55),0 10px 20px #06051d57,inset 0 1px #ffffff73;flex-direction:column;gap:6px;text-transform:none;text-shadow:0 2px 4px rgba(4,6,22,.52)}
.card.category::before{content:"";position:absolute;inset:5px;border-radius:10px;border:1px solid #ffffff1f;pointer-events:none}
.card.category .name{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:100%;min-height:18px;font-size:11px;line-height:.98;font-weight:800;padding:3px 2px;border-radius:8px;background:rgba(11,16,48,.24);border:1px solid rgba(255,255,255,.16);overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none}
.card.category .name.short-title{white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
.card.category .name.long-title{white-space:normal;overflow-wrap:anywhere;word-break:normal}
.card.category .count{position:relative;z-index:1;font-size:10.5px;line-height:19px;min-width:35px;height:19px;padding:0 7px;border-radius:999px;background:rgba(8,13,40,.6);border:1px solid rgba(255,255,255,.36);font-weight:800;color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.12)}
.card.stack-under{filter:brightness(.94) saturate(.96);border-color:#dad6ef;box-shadow:0 3px 0 #0909231d,0 5px 12px #04061730,inset 0 1px rgba(255,255,255,.92)}
.card.stack-under::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(121,107,176,.22);pointer-events:none}
.card.drag-source{visibility:hidden}.card.hint{animation:hintPulse .7s ease 2}
.stock .card,.slot .card{top:0}.waste .card{top:0;left:var(--waste-x,0px)}
.pile-count{position:absolute;right:3px;bottom:3px;z-index:6;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#12122bed;color:#fff;border:1px solid #ffffff2b;display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 3px 8px #0006}.stock-count{position:absolute;right:3px;bottom:3px;z-index:6;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#12122bed;color:#fff;border:1px solid #ffffff2b;display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 3px 8px #0006}
@keyframes hintPulse{50%{transform:translateY(-6px) scale(1.04);filter:brightness(1.1);box-shadow:0 0 0 4px #ffd85c3a,0 10px 20px #0005}}
.drag-stack{position:fixed;z-index:9999;pointer-events:none;width:var(--cw);height:calc(var(--ch) + 25px);transform:translate(-50%,-30px) rotate(2deg);filter:drop-shadow(0 17px 19px #0008)}
.drag-stack .shadow-card{position:absolute;left:0;top:calc(var(--i)*6px);width:100%;height:var(--ch);border-radius:var(--radius);border:1px solid #ffffff9a;background:linear-gradient(160deg,#fff,#e9e5f8)}
.drag-stack .drag-main{position:absolute;left:0;top:18px;width:var(--cw);height:var(--ch);border-radius:var(--radius);border:1px solid #fff;background:linear-gradient(165deg,#fff,#f0edff);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 5px;font-size:13px;line-height:1.0;font-weight:800;letter-spacing:-.015em;z-index:5;overflow:hidden;overflow-wrap:break-word;word-break:normal;box-shadow:0 7px 20px #0005}
.drag-stack .drag-main.category{--h:var(--cat-hue,258);background:linear-gradient(155deg,hsl(var(--h) 84% 62%),hsl(calc(var(--h) + 18) 78% 46%));color:#fff;flex-direction:column;gap:5px;text-shadow:0 2px 4px rgba(4,6,22,.52)}
.drag-stack .drag-count{position:absolute;right:-7px;top:5px;z-index:8;min-width:29px;height:23px;padding:0 6px;border-radius:999px;background:linear-gradient(135deg,#ffcf50,#ff8e4d);color:#2d1931;border:2px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:950;box-shadow:0 4px 12px #0005}
.auto-fly{position:fixed!important;z-index:10020!important;pointer-events:none!important;margin:0!important;transition:none!important;filter:drop-shadow(0 16px 18px rgba(0,0,0,.45));will-change:left,top,transform,opacity}
.auto-fly-count{position:absolute;right:-8px;top:-8px;z-index:3;min-width:25px;height:22px;padding:0 6px;border-radius:999px;background:#17172f;color:#fff;border:2px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 4px 10px #0005}
.auto-source{visibility:hidden!important}
.controls{display:grid;grid-template-columns:.88fr .95fr 1.12fr 1fr;gap:5px;padding:4px;border:1px solid #ffffff12;border-radius:17px;background:#09091f35;box-shadow:inset 0 1px #ffffff0b;backdrop-filter:blur(12px)}
.controls button{min-width:0;min-height:45px;border:0;border-radius:13px;background:#ffffff10;color:#d9d7f4;font-weight:850;font-size:10px;padding:0 4px;border:1px solid #ffffff0c;box-shadow:inset 0 1px #ffffff0b;transition:transform .12s,filter .12s,background .12s}.controls #menuButton{background:linear-gradient(145deg,#2e2a61,#26234f);color:#fff;border-color:#ffffff18}
.controls button:active{transform:scale(.965)}.controls #hint{background:linear-gradient(145deg,#ffffff,#f2efff);color:#292344;box-shadow:0 5px 14px #06051c35}.controls .primary{background:linear-gradient(135deg,#8c62ff,#6c54ee 46%,#477cf7);color:#fff;border-color:#ffffff24;box-shadow:0 6px 16px #593cff42,inset 0 1px #ffffff55}.controls button:disabled{opacity:.35;filter:saturate(.5)}
.toast{position:fixed;left:50%;bottom:76px;z-index:10000;transform:translate(-50%,16px) scale(.96);opacity:0;pointer-events:none;transition:.2s cubic-bezier(.2,.8,.2,1);background:#17152bef;color:#fff;border:1px solid #ffffff23;box-shadow:0 10px 30px #0006,inset 0 1px #ffffff14;border-radius:999px;padding:10px 14px;font-size:10px;font-weight:750;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(12px)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.coach{position:absolute;left:50%;top:104px;z-index:120;max-width:88%;transform:translate(-50%,-5px);opacity:0;pointer-events:none;padding:9px 12px;border-radius:13px;background:#17152bea;border:1px solid #ffffff22;box-shadow:0 10px 28px #0005;color:#f5f3ff;font-size:9px;line-height:1.25;text-align:center;transition:.25s}.coach.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:11000;display:none;place-items:center;background:linear-gradient(#0d0a24c7,#09081be8);padding:20px;backdrop-filter:blur(8px)}.modal.show{display:grid}
.modal-card{position:relative;overflow:hidden;width:min(330px,92vw);padding:25px 21px 21px;border-radius:26px;background:linear-gradient(165deg,#fff,#f3f0ff);color:#24223a;text-align:center;box-shadow:0 24px 65px #0009;border:1px solid #ffffff}
.modal-card::before{content:"";position:absolute;width:190px;height:190px;left:-55px;top:-95px;border-radius:50%;background:radial-gradient(circle,#8b64ff33,transparent 70%)}
.win-icon{position:relative;width:58px;height:58px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#ffd85c,#ff9f55);box-shadow:0 10px 24px #ff9c4c45, inset 0 1px #fff8;transform:rotate(-4deg)}
.modal-card h2{position:relative;margin:0 0 6px;font-size:22px;letter-spacing:-.04em}.modal-card p{position:relative;margin:0 0 17px;color:#74708b;font-size:12px}.modal-card button{position:relative;width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#8b62ff,#5f63ed,#4f8cff);color:#fff;padding:13px 18px;font-weight:900;box-shadow:0 8px 18px #6656e63d}
.celebration{position:fixed;inset:0;z-index:10900;pointer-events:none;overflow:hidden}.spark{position:absolute;left:50%;top:47%;width:8px;height:14px;border-radius:3px;background:hsl(var(--spark-h) 92% 63%);animation:sparkFly .9s cubic-bezier(.2,.7,.2,1) forwards;transform:translate(-50%,-50%) rotate(var(--r))}
@keyframes sparkFly{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--r) + 320deg));opacity:0}}
@media(max-height:650px){:root{--up-step:8px;--down-step:8px}.app{gap:5px}.controls button{min-height:40px}.category-row{margin-bottom:7px;padding-bottom:8px}.game{padding-top:7px}.draw-row{margin-bottom:8px;padding:5px 7px}.coach{top:92px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


.achievement-notice{position:fixed;left:50%;top:max(18px,calc(env(safe-area-inset-top) + 12px));z-index:15000;width:min(330px,calc(100vw - 28px));transform:translate(-50%,-18px) scale(.96);opacity:0;pointer-events:none;transition:.26s cubic-bezier(.2,.82,.2,1)}
.achievement-notice.show{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.achievement-notice-card{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:center;padding:13px 14px;border-radius:19px;background:linear-gradient(145deg,#211b53f5,#302067f7);border:1px solid #ffffff35;box-shadow:0 18px 45px #05051899,inset 0 1px #ffffff1e;color:#fff;backdrop-filter:blur(16px)}
.achievement-notice-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd966,#ff974d);color:#39233d;font-size:21px;font-weight:900;box-shadow:0 7px 18px #ff993f40,inset 0 1px #fff8}
.achievement-notice-kicker{display:block;color:#ffd96f;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.achievement-notice-title{display:block;font-size:14px;line-height:1.05;font-weight:900}
.achievement-notice-desc{display:block;margin-top:4px;color:#c9c5e9;font-size:9px;line-height:1.2;font-weight:700}

/* ===== Meta progression / hub ===== */
.brand{cursor:pointer;-webkit-tap-highlight-color:transparent}.brand:active{transform:scale(.985)}
.progress-label{display:flex;gap:5px;align-items:center}.progress-stars{color:#ffd86a;font-weight:900;letter-spacing:0}
.hub{position:fixed;inset:0;z-index:13000;display:none;background:linear-gradient(165deg,#161039f5,#0e153af7);backdrop-filter:blur(14px);overflow:hidden}.hub.show{display:block}
.hub-shell{width:min(520px,100%);height:100%;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(160deg,#29205d,#151d4a);box-shadow:0 0 60px #0008}
.hub-head{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #ffffff12}.hub-head h2{margin:0;flex:1;font-size:20px}.hub-close{width:38px;height:38px;border:0;border-radius:12px;background:#ffffff12;color:#fff;font-size:21px}.hub-scroll{overflow:auto;padding:12px 12px max(22px,env(safe-area-inset-bottom));display:grid;gap:11px;overscroll-behavior:contain}
.hub-hero{padding:15px;border-radius:20px;background:linear-gradient(135deg,#8b61ff33,#4ed7ff1e);border:1px solid #ffffff18;box-shadow:inset 0 1px #ffffff13}.hub-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.hub-level{font-size:12px;color:#c9c6ef}.hub-stars{font-size:25px;font-weight:900;color:#ffd968}.hub-progress{height:8px;margin-top:10px;border-radius:99px;background:#ffffff12;overflow:hidden}.hub-progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ed7ff,#8b62ff,#ff64aa);border-radius:inherit}
.hub-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hub-action{min-height:66px;border:1px solid #ffffff14;border-radius:17px;background:#ffffff0d;color:#fff;text-align:left;padding:11px 12px;font-weight:900;box-shadow:inset 0 1px #ffffff0d}.hub-action strong{display:block;font-size:13px}.hub-action span{display:block;margin-top:4px;font-size:9px;color:#bbb7df;font-weight:700}.hub-action.daily{background:linear-gradient(135deg,#ff8f5630,#ff5ea226)}.hub-action.primary{background:linear-gradient(135deg,#815fff,#4d7df5);box-shadow:0 8px 22px #5b45dd42}
.hub-section{padding:13px;border-radius:19px;background:#ffffff08;border:1px solid #ffffff12}.hub-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.hub-section h3{margin:0;font-size:14px}.hub-section small{color:#aaa6cf;font-size:9px}

/* Compact phones: preserve five playable columns instead of shrinking the whole UI indiscriminately. */
@media(max-width:350px){
  :root{--cw:54px;--gap:4px;--radius:14px}
  .app{padding-left:max(5px,env(safe-area-inset-left));padding-right:max(5px,env(safe-area-inset-right))}
  .game{padding-left:5px;padding-right:5px}

  .controls{gap:4px}.controls button{font-size:9.5px;padding:0 2px}
  .draw-label{font-size:7.5px;letter-spacing:.09em}
}

/* Short screens: cards stay large; only cascade depth and vertical chrome compress. */
@media(max-height:740px){
  :root{--up-step:7px;--down-step:7px}
  .app{gap:6px}
  .game{padding-top:7px}
  .draw-row{margin-bottom:8px;padding-top:6px;padding-bottom:6px}
  .category-row{margin-bottom:7px;padding-bottom:8px}
  .controls button{min-height:44px}
  .hud{gap:6px}.top{min-height:38px}
  .progress-wrap{gap:6px}
  .coach{top:92px}
}
@media(max-height:620px){
  :root{--up-step:6px;--down-step:6px}
  .app{gap:4px}
  .game{padding-top:5px;padding-bottom:5px}

  .brand small{display:none}.progress-label>span:last-child{display:none}
}

/* Landscape phones use available width while keeping the same card geometry. */
@media(orientation:landscape) and (max-height:520px){
  .app{max-width:600px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}
  .hub-shell{width:min(600px,100%)}

  .brand-mark{width:30px;height:30px;font-size:16px}.brand b{font-size:15px}.brand small{display:none}

  .draw-row{margin-bottom:5px}.category-row{margin-bottom:4px;padding-bottom:5px}
}

/* Tablet/desktop: keep a deliberate phone-game canvas instead of stretching into a dashboard. */
@media(min-width:700px){
  .app{border-left:1px solid #ffffff10;border-right:1px solid #ffffff10}
}

<script>
let BANK=[];

 {id:'violet',name:'Violet',stars:0},{id:'ocean',name:'Ocean',stars:30},{id:'sunset',name:'Sunset',stars:75},
 {id:'paper',name:'Paper',stars:100},{id:'aurora',name:'Aurora',stars:150},{id:'neon',name:'Neon',stars:225}

const ACHIEVEMENTS=[
 {id:'first',icon:'✦',title:'Первый расклад',desc:'Пройти 1 уровень',test:p=>p.stats.levelsCompleted>=1},

 let completed=Math.max(0,(+profile.currentLevel||1)-1);

const nextPaint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function animateAutoMove(card,payload,target){if(autoMoveBusy)return;autoMoveBusy=true;const targetCard=target.querySelector('.card'),targetRect=(targetCard||target).getBoundingClientRect(),sources=sourceNodesForPayload(payload,card).filter(n=>n?.isConnected);if(!sources.length){autoMoveBusy=false;return}const reduced=matchMedia?.('(prefers-reduced-motion: reduce)').matches,duration=reduced?80:215,flies=sources.map((source,i)=>{const r=source.getBoundingClientRect(),fly=source.cloneNode(true);fly.classList.remove('movable','drag-source','hint','auto-source');fly.classList.add('auto-fly');Object.assign(fly.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:String(10020+i)});fly.removeAttribute('data-source');document.body.appendChild(fly);fitAllCardText(fly);return{source,fly,rect:r}});await nextPaint();sources.forEach(n=>n.classList.add('auto-source'));const cx=targetRect.left+targetRect.width/2,cy=targetRect.top+targetRect.height/2;await Promise.all(flies.map(({fly,rect},i)=>{const dx=cx-(rect.left+rect.width/2),dy=cy-(rect.top+rect.height/2);return fly.animate([{transform:'translate3d(0,0,0) scale(1)',opacity:1},{transform:`translate3d(${dx*.45}px,${dy*.45}px,0) scale(1.035)`,opacity:1,offset:.42},{transform:`translate3d(${dx}px,${dy}px,0) scale(.96)`,opacity:1}],{duration:duration+Math.min(i,4)*7,easing:'cubic-bezier(.22,.78,.18,1)',fill:'forwards'}).finished.catch(()=>{})}));state.run.autoMoves++;profile.stats.autoMoves++;track('auto_move',{mode:state.mode});const moved=performDrop(payload,target);if(!moved){sources.forEach(n=>n.classList.remove('auto-source'));flies.forEach(x=>x.fly.remove());autoMoveBusy=false;return}await nextPaint();await Promise.all(flies.map(({fly})=>fly.animate([{opacity:1},{opacity:0}],{duration:reduced?25:70,fill:'forwards'}).finished.catch(()=>{})));flies.forEach(x=>x.fly.remove());autoMoveBusy=false}
function handleCardTap(card,payload){const now=performance.now(),key=payloadTapKey(payload);if(lastTap.key===key&&now-lastTap.time<340){lastTap={key:null,time:0};const target=autoTargetForPayload(payload),moving=payloadGroup(payload),cc=categoryCard(moving);if(!target||!canDrop(payload,target)){showToast(cc?'Нет свободного поля категории':'Сначала открой категорию');return}animateAutoMove(card,payload,target)}else lastTap={key,time:now}}
function startDrag(e){if(autoMoveBusy||hub.classList.contains('show')||modal.classList.contains('show'))return;const card=e.target.closest('.card.movable');if(!card)return;e.preventDefault();const payload=getDragPayload(card);if(!payload)return;const sourceNodes=sourceNodesForPayload(payload,card),ghost=document.createElement('div');ghost.className='drag-stack';ghost.style.opacity='0';const total=payload.groups.reduce((n,g)=>n+g.cards.length,0),shadows=Math.min(3,Math.max(0,total-1));for(let i=0;i<shadows;i++){const sh=document.createElement('div');sh.className='shadow-card';sh.style.setProperty('--i',i);ghost.appendChild(sh)}const top=payload.groups[0],main=document.createElement('div'),cc=categoryCard(top);main.className='drag-main'+(cc?' category':'');if(cc){main.style.setProperty('--cat-hue',catHue(cc.cat));main.innerHTML=`<span>${cc.label}</span><span>${wordCount(top)}/${cc.total}</span>`}else main.textContent=top.cards[0].label;ghost.appendChild(main);if(total>1){const c=document.createElement('div');c.className='drag-count';c.textContent=`${total} карт`;ghost.appendChild(c)}document.body.appendChild(ghost);fitAllCardText(ghost);drag={payload,card,ghost,sourceNodes,startX:e.clientX,startY:e.clientY,moved:false};moveDrag(e)}
function moveDrag(e){if(!drag)return;e.preventDefault();const d=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);if(!drag.moved&&d>7){drag.moved=true;drag.sourceNodes.forEach(n=>n.classList.add('drag-source'));drag.ghost.style.opacity='1'}drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}
function endDrag(e){if(!drag)return;const d=drag;drag=null;d.ghost.remove();if(!d.moved){handleCardTap(d.card,d.payload);return}const t=targetFromPoint(e.clientX,e.clientY);d.sourceNodes.forEach(n=>n.classList.remove('drag-source'));if(!performDrop(d.payload,t)){haptic(22);showToast('Сюда положить нельзя');render()}}
let lastTouchEndAt=0;
document.addEventListener('touchend',e=>{if(!e.target.closest('.card,.stock,.waste,.slot,button,.brand'))return;const now=Date.now();if(now-lastTouchEndAt<360)e.preventDefault();lastTouchEndAt=now},{passive:false});
document.addEventListener('dblclick',e=>{if(e.target.closest('.app,.modal,.hub'))e.preventDefault()},{passive:false});
document.addEventListener('pointerdown',startDrag);window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag);

function calculateStars(){return Math.min(3,1+(state.run.hints===0?1:0)+(state.run.undos===0?1:0))}
function updateDailyStreak(date){const d=profile.daily;if(d.completedDates.includes(date))return;const diff=d.lastDate?daysBetween(d.lastDate,date):null;if(diff===1)d.currentStreak++;else if(diff===2&&d.freezeWeek!==weekKey(date)){d.currentStreak=Math.max(1,d.currentStreak+1);d.freezeWeek=weekKey(date)}else if(diff===0){}else d.currentStreak=1;d.lastDate=date;d.bestStreak=Math.max(d.bestStreak,d.currentStreak);d.completedDates.push(date);if(d.completedDates.length>120)d.completedDates=d.completedDates.slice(-120)}
let achievementQueue=[],achievementNoticeBusy=false,achievementNoticeTimer=null;
function showNextAchievement(){
 if(achievementNoticeBusy||!achievementQueue.length)return;
 const a=achievementQueue.shift();achievementNoticeBusy=true;
 $('#achievementNoticeIcon').textContent=a.icon||'🏆';$('#achievementNoticeTitle').textContent=a.title;$('#achievementNoticeDesc').textContent=a.desc;
 achievementNotice.classList.add('show');haptic([12,35,18]);
 clearTimeout(achievementNoticeTimer);achievementNoticeTimer=setTimeout(()=>{achievementNotice.classList.remove('show');setTimeout(()=>{achievementNoticeBusy=false;showNextAchievement()},260)},2700);
}
function queueAchievementNotifications(items){if(!items?.length)return;achievementQueue.push(...items);showNextAchievement()}
achievementNotice.addEventListener('click',()=>{clearTimeout(achievementNoticeTimer);achievementNotice.classList.remove('show');setTimeout(()=>{achievementNoticeBusy=false;showNextAchievement()},180)});
function checkAchievements(){const fresh=[];for(const a of ACHIEVEMENTS)if(!profile.achievements.includes(a.id)&&a.test(profile)){profile.achievements.push(a.id);fresh.push(a)}if(fresh.length){saveProfile();queueAchievementNotifications(fresh)}return fresh}
function nextTheme(){return THEME_DEFS.find(t=>t.stars>profile.totalStars)||null}
function finishLevel(){state.rewarded=true;const stars=calculateStars();let newAchievements=[];if(state.mode==='regular'){const old=profile.starsByLevel[state.level]||0;profile.starsByLevel[state.level]=Math.max(old,stars);profile.currentLevel=Math.max(profile.currentLevel,state.level+1);profile.stats.levelsCompleted++;if(stars===3)profile.stats.tripleStarWins++;if(state.run.hints===0)profile.stats.noHintWins++;if(state.run.undos===0)profile.stats.noUndoWins++;track('level_completed',{level:state.level,stars})}else if(state.mode==='daily'){const date=todayKey();profile.dailyStars[date]=Math.max(profile.dailyStars[date]||0,stars);if(!profile.daily.completedDates.includes(date))profile.stats.dailyCompleted++;updateDailyStreak(date);track('daily_completed',{date,stars})}else if(state.mode==='tutorial'){track('tutorial_completed',{step:state.tutorialStep});if(state.tutorialStep===3)profile.tutorialComplete=true}recomputeStars();newAchievements=checkAchievements();save();showWin(stars,newAchievements);burst(true);haptic([20,35,45])}
function showWin(stars,newAchievements=[]){$('#winTitle').textContent=state.mode==='daily'?'Daily пройден!':state.mode==='tutorial'?`Обучение ${state.tutorialStep}/3`:`Уровень ${state.level} пройден`;$('#winStars').innerHTML=[1,2,3].map(i=>`<span class="${i<=stars?'earned':''}">★</span>`).join('');$('#winText').textContent=state.mode==='daily'?`Серия: ${profile.daily.currentStreak} дн.`:state.mode==='tutorial'?(state.tutorialStep<3?'Отлично. Переходим к следующей механике.':'Обучение закончено. Теперь начинается настоящая игра.'):`${state.totalCategories} категорий собрано.`;$('#winMetrics').innerHTML=`<span class="win-chip ${state.run.hints===0?'good':''}">${state.run.hints?'Подсказки: '+state.run.hints:'Без подсказок'}</span><span class="win-chip ${state.run.undos===0?'good':''}">${state.run.undos?'Отмены: '+state.run.undos:'Без отмен'}</span>`;$('#winStarTotal').textContent=`★ ${profile.totalStars} всего`;const nt=nextTheme();$('#winUnlock').textContent=nt?`До темы ${nt.name}: ${nt.stars-profile.totalStars} ★`:'Все темы открыты';$('#next').textContent=state.mode==='tutorial'?(state.tutorialStep<3?'Дальше →':'Начать игру →'):state.mode==='daily'?'Новый уровень →':'Следующий уровень →';$('#replay').style.display=state.mode==='tutorial'?'none':'block';modal.classList.add('show')}
function updateCoach(){if(state.mode!=='tutorial'){coach.classList.remove('show','tutorial');return}coach.classList.add('show','tutorial');const texts={1:['Шаг 1 из 3','Дважды нажми на карточку категории — она сама отправится в свободный слот сверху.'],2:['Шаг 2 из 3','Связанные слова можно складывать друг на друга или дважды нажимать, чтобы отправить их в открытую категорию.'],3:['Шаг 3 из 3','Нажми на колоду, чтобы открыть карту. Двойной тап по сбросу отправит подходящее слово в категорию.']};$('#coachStep').textContent=texts[state.tutorialStep][0];$('#coachText').textContent=texts[state.tutorialStep][1]}

function renderHub(){recomputeStars();const nt=nextTheme(),dailyDone=profile.daily.completedDates.includes(todayKey()),discovered=new Set(profile.discovered),unlockedThemes=THEME_DEFS.filter(t=>profile.totalStars>=t.stars);const collection=BANK.map(c=>`<div class="collection-item ${discovered.has(c.id)?'seen':'locked'}">${discovered.has(c.id)?c.title:'???'}</div>`).join('');const ach=ACHIEVEMENTS.map(a=>{const done=profile.achievements.includes(a.id);return`<div class="achievement ${done?'':'locked'}"><div class="ico">${a.icon}</div><div><b>${a.title}</b><p>${a.desc}</p></div><span class="done">${done?'✓':''}</span></div>`}).join('');const themes=THEME_DEFS.map(t=>{const unlocked=profile.totalStars>=t.stars;return`<button class="theme-tile theme-${t.id} ${unlocked?'':'locked'} ${profile.theme===t.id?'selected':''}" data-theme-id="${t.id}" ${unlocked?'':'disabled'}><b>${t.name}</b><span>${unlocked?'Открыто':t.stars+' ★'}</span></button>`}).join('');const nextLevel=profile.currentLevel||1;const levelStars=profile.starsByLevel[nextLevel]||0;hubContent.innerHTML=`<section class="hub-hero"><div class="hub-hero-top"><div><div class="hub-level">Следующий уровень: ${nextLevel}</div><div class="hub-stars">★ ${profile.totalStars}</div></div><span class="daily-badge">🔥 ${profile.daily.currentStreak} дн.</span></div><div class="hub-progress"><i style="width:${nt?Math.min(100,profile.totalStars/nt.stars*100):100}%"></i></div><div class="hub-level" style="margin-top:6px">${nt?`Следующая тема ${nt.name} — ещё ${nt.stars-profile.totalStars} ★`:'Все темы открыты'}</div></section><div class="hub-actions"><button class="hub-action primary" id="hubContinue"><strong>▶ Продолжить</strong><span>Уровень ${state?.mode==='regular'?state.level:nextLevel}</span></button><button class="hub-action daily" id="hubDaily"><strong>☀ Daily</strong><span>${dailyDone?'Сегодня пройдено ✓':'Один расклад для всех'}</span></button><button class="hub-action" id="hubTutorial"><strong>◇ Обучение</strong><span>3 коротких шага</span></button><button class="hub-action" id="hubNew"><strong>↻ Текущий уровень</strong><span>${levelStars?'Лучший результат: '+levelStars+' ★':'Ещё не пройден'}</span></button></div><section class="hub-section"><div class="hub-section-head"><h3>Темы</h3><small>${unlockedThemes.length}/${THEME_DEFS.length}</small></div><div class="theme-grid">${themes}</div></section><section class="hub-section"><div class="hub-section-head"><h3>Коллекция категорий</h3><small>${discovered.size}/${BANK.length}</small></div><div class="collection-grid">${collection}</div></section><section class="hub-section"><div class="hub-section-head"><h3>Достижения</h3><small>${profile.achievements.length}/${ACHIEVEMENTS.length}</small></div><div class="achievement-list">${ach}</div></section><section class="hub-section"><div class="hub-section-head"><h3>Статистика</h3><small>локально на устройстве</small></div><div class="stats-grid"><div class="stat-box"><b>${profile.stats.levelsCompleted}</b><span>уровней</span></div><div class="stat-box"><b>${profile.stats.categoriesCompleted}</b><span>категорий</span></div><div class="stat-box"><b>${profile.stats.tripleStarWins}</b><span>★★★ уровней</span></div><div class="stat-box"><b>${profile.daily.bestStreak}</b><span>рекорд серии</span></div><div class="stat-box"><b>${profile.stats.hints}</b><span>подсказок</span></div><div class="stat-box"><b>${profile.stats.undos}</b><span>отмен</span></div></div></section>`;$('#hubContinue').onclick=()=>closeHub();$('#hubDaily').onclick=()=>{closeHub();makeLevel(0,{mode:'daily',seed:`daily:${todayKey()}`})};$('#hubTutorial').onclick=()=>{closeHub();makeLevel(1,{mode:'tutorial',step:1})};$('#hubNew').onclick=()=>{closeHub();makeLevel(profile.currentLevel||1)};hubContent.querySelectorAll('[data-theme-id]').forEach(btn=>btn.onclick=()=>{profile.theme=btn.dataset.themeId;saveProfile();renderHub();showToast(`Тема: ${THEME_DEFS.find(t=>t.id===profile.theme).name}`)})}
function openHub(){renderHub();hub.classList.add('show');track('hub_opened')}function closeHub(){hub.classList.remove('show')}
$('.brand').addEventListener('click',openHub);$('#menuButton').onclick=openHub;$('#hubClose').onclick=closeHub;

$('#undo').onclick=()=>{if(history.length&&!autoMoveBusy){const previous=history.pop();const undoCount=(state.run?.undos||0)+1;state=normalizeState(previous);state.run.undos=undoCount;profile.stats.undos++;track('undo',{mode:state.mode});render()}};
$('#restart').onclick=()=>{if(autoMoveBusy)return;profile.stats.restarts++;track('level_restarted',{level:state.level,mode:state.mode});if(state.mode==='tutorial')makeLevel(state.tutorialStep,{mode:'tutorial',step:state.tutorialStep});else makeLevel(state.level,{mode:state.mode,seed:state.seed})};
$('#hint').onclick=()=>{if(autoMoveBusy)return;state.run.hints++;profile.stats.hints++;track('hint_used',{mode:state.mode});const payloads=[];state.columns.forEach((col,ci)=>{const start=firstOpenIndex(col);if(start<col.length)payloads.push({source:'column',ci,start,groups:col.slice(start)})});if(state.waste.length)payloads.push({source:'waste',groups:[{cards:[state.waste.at(-1)],faceUp:true}]});state.slots.forEach((g,si)=>{if(g)payloads.push({source:'slot',si,groups:[g]})});const targets=[...document.querySelectorAll('[data-zone]')];for(const p of payloads)for(const t of targets)if(canDrop(p,t)){let q;if(p.source==='column')q=`.card[data-source="column"][data-col="${p.ci}"]`;else if(p.source==='waste')q='.waste .card.movable';else q=`.slot[data-index="${p.si}"] .card`;const n=document.querySelector(q);n?.classList.add('hint');setTimeout(()=>n?.classList.remove('hint'),1400);showToast(`Ход: ${groupLabel(p.groups[0])}`);save();return}showToast(state.stock.length||state.waste.length?'Открой следующую карту колоды':'Доступных ходов не найдено');save()};
$('#next').onclick=()=>{modal.classList.remove('show');if(state.mode==='tutorial'){if(state.tutorialStep<3)makeLevel(state.tutorialStep+1,{mode:'tutorial',step:state.tutorialStep+1});else makeLevel(profile.currentLevel||1)}else if(state.mode==='daily')makeLevel(profile.currentLevel||1);else makeLevel(state.level+1)};
$('#replay').onclick=()=>{modal.classList.remove('show');if(state.mode==='daily')makeLevel(0,{mode:'daily',seed:state.seed});else makeLevel(state.level,{mode:'regular',seed:state.seed})};

loadCategoryBank().then(()=>{profile.tutorialComplete=true;makeLevel(70,{mode:'regular',seed:'responsive-test'});checkAchievements();saveProfile()}).catch(err=>{console.error(err);showToast('Ошибка загрузки базы категорий')});
</script>
