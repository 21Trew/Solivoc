<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.solivoc.ru; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Словасьянс · Управление</title>
  <link rel="stylesheet" href="./styles/admin.css">
  <link rel="stylesheet" href="./styles/admin-ux.css?v=2">
</head>
<body>
  <section id="adminAuth" class="auth-screen">
    <form id="adminLoginForm" class="auth-card" autocomplete="on">
      <div class="brand-mark" aria-hidden="true">С</div>
      <div>
        <small class="eyebrow">СЛОВАСЬЯНС</small>
        <h1>Управление игрой</h1>
        <p>Защищённая операторская консоль.</p>
      </div>
      <label>Логин<input id="adminLogin" name="username" type="text" autocomplete="username" maxlength="120" required></label>
      <label>Пароль<span class="password-field"><input id="adminPassword" name="password" type="password" autocomplete="current-password" maxlength="256" required><button id="adminPasswordToggle" type="button" class="text-button">Показать</button></span></label>
      <button id="adminConnect" class="primary-button" type="submit">Войти</button>
      <div id="adminLoginStatus" class="inline-status" role="status" aria-live="polite"></div>
      <a class="back-link" href="/">← Вернуться в игру</a>
    </form>
  </section>

  <div id="adminApp" class="app-shell" hidden>
    <aside id="adminSidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small" aria-hidden="true">С</div>
        <div><small>СЛОВАСЬЯНС</small><strong>Админка</strong></div>
        <button id="sidebarClose" class="icon-button sidebar-close" type="button" aria-label="Закрыть меню">×</button>
      </div>
      <nav class="main-nav" aria-label="Разделы админки">
        <button type="button" data-section="overview"><span>⌂</span><b>Обзор</b></button>
        <button type="button" data-section="players"><span>♟</span><b>Игроки</b><em id="navPlayerCount"></em></button>
        <button type="button" data-section="messages"><span>✉</span><b>Сообщения</b></button>
        <button type="button" data-section="leaderboards"><span>≡</span><b>Лидерборды</b></button>
        <button type="button" data-section="audit"><span>◷</span><b>Журнал</b></button>
        <button type="button" data-section="system"><span>⚙</span><b>Система</b></button>
      </nav>
      <div class="sidebar-foot">
        <div class="session-indicator"><i></i><span>Админ-сессия активна</span></div>
        <a href="/">Открыть игру ↗</a>
        <button id="adminLogout" type="button" class="secondary-button full">Выйти</button>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <main class="workspace">
      <header class="topbar">
        <button id="sidebarOpen" class="icon-button menu-button" type="button" aria-label="Открыть меню">☰</button>
        <div class="topbar-title"><small id="pageEyebrow">УПРАВЛЕНИЕ</small><h2 id="pageTitle">Обзор</h2><p id="pageSubtitle">Состояние игры и быстрые действия.</p></div>
        <div class="topbar-actions">
          <button id="globalRefresh" type="button" class="secondary-button">Обновить</button>
        </div>
      </header>
      <div id="adminStatus" class="global-status" role="status" aria-live="polite"></div>
      <div id="adminView" class="view"></div>
    </main>
  </div>

  <dialog id="adminConfirmDialog" class="confirm-dialog">
    <form method="dialog" id="adminConfirmForm">
      <div class="dialog-icon" id="confirmIcon">!</div>
      <h3 id="confirmTitle">Подтверждение</h3>
      <p id="confirmText"></p>
      <label id="confirmPhraseWrap" hidden>Для подтверждения введи <code id="confirmPhraseLabel"></code><input id="confirmPhraseInput" autocomplete="off"></label>
      <div class="dialog-actions"><button value="cancel" class="secondary-button">Отмена</button><button id="confirmAccept" value="default" class="primary-button">Продолжить</button></div>
    </form>
  </dialog>

  <script src="./js/host-routing.js"></script>
  <script src="./js/runtime-config.js"></script>
  <script src="./js/api-client.js"></script>
  <script src="./js/admin-ux.js?v=2"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
